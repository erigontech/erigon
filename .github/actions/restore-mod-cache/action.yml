name: Restore Go module cache
description: Restore Go module cache keyed by workflow, job, and cache class

inputs:
  modcache-path:
    description: "GOMODCACHE path"
    required: true
  workflow-id:
    description: "Workflow name for cache key namespacing"
    required: true
  matrix-key:
    description: "Extra segment in the cache key (e.g. matrix value)"
    required: false
    default: ''

outputs:
  restored-key:
    description: "The key that was restored (empty if miss)"
    value: ${{ steps.restore.outputs.cache-matched-key }}
  primary-key:
    # Class key (not per-run): the first successful save wins until GitHub's
    # ~7-day eviction, mirroring restore-build-cache.
    description: "The primary cache key (for use by save-mod-cache)"
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.modcache-path }}/cache/download
        key: gomodcache|${{ inputs.workflow-id }}|${{ github.job }}|${{ inputs.matrix-key }}|${{ runner.os }}|${{ hashFiles('go.sum') }}
        # Prefix match also picks up legacy entries that carried a run_id suffix.
        restore-keys: |
          gomodcache|${{ inputs.workflow-id }}|${{ github.job }}|${{ inputs.matrix-key }}|${{ runner.os }}|${{ hashFiles('go.sum') }}|

    - name: Warn on module cache miss
      if: ${{ steps.restore.outputs.cache-matched-key == '' }}
      shell: bash
      run: echo "::warning::Go module cache miss — no matching key found"
