name: Restore Go build cache
description: Restore Go build cache keyed by workflow, job, and cache class

inputs:
  gocache-path:
    description: "GOCACHE path"
    required: true
  goversion:
    description: "Full Go version string (e.g. go1.25.7) — output of `go env GOVERSION`"
    required: true
  workflow-id:
    description: "Workflow name for cache key namespacing"
    required: true
  matrix-key:
    description: "Extra segment appended after runner.arch in the cache key (e.g. matrix value)"
    required: false
    default: ''

outputs:
  restored-key:
    description: "The key that was restored (empty if miss)"
    value: ${{ steps.restore.outputs.cache-matched-key }}
  primary-key:
    # The key names one cache class (workflow|job|matrix|goversion|os|arch) per
    # ISO week, not a run: the first successful save of the week wins and every
    # later run restores it. GOCACHE is content-addressed, so a week-old entry
    # only costs a rebuild of newer objects, never wrong results.
    description: "The primary cache key (for use by save-build-cache)"
    value: gocache|${{ inputs.workflow-id }}|${{ github.job }}|${{ inputs.matrix-key }}|${{ inputs.goversion }}|${{ runner.os }}|${{ runner.arch }}|${{ steps.rotation.outputs.segment }}

runs:
  using: composite
  steps:
    - id: rotation
      shell: bash
      run: echo "segment=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.gocache-path }}
        key: gocache|${{ inputs.workflow-id }}|${{ github.job }}|${{ inputs.matrix-key }}|${{ inputs.goversion }}|${{ runner.os }}|${{ runner.arch }}|${{ steps.rotation.outputs.segment }}
        # Prefix match falls back to the previous week's entry, and also picks
        # up legacy entries that carried a run_id suffix.
        restore-keys: |
          gocache|${{ inputs.workflow-id }}|${{ github.job }}|${{ inputs.matrix-key }}|${{ inputs.goversion }}|${{ runner.os }}|${{ runner.arch }}|

    - name: Warn on build cache miss
      if: ${{ steps.restore.outputs.cache-matched-key == '' }}
      shell: bash
      run: echo "::warning::Go build cache miss — no matching key found"
