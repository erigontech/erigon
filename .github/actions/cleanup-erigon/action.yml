name: Cleanup Erigon
description: Save build and module caches, and report uncached test packages

runs:
  using: composite
  steps:
    # Skip all Go cache saves in merge-queue runs: caches saved on the ephemeral
    # merge-queue ref cannot be restored by any later run. Cache keys name a
    # class (workflow|job|matrix) per ISO week, so a probe hit means an earlier
    # run already saved this week's entry and saving again is neither possible
    # nor useful. Two runs finishing at the same time can both miss the probe
    # and race the save; the loser's reserve-conflict failure is swallowed
    # below — a lost cache save only costs the next run a rebuild.
    - name: Check for existing build cache entry
      id: gocache-probe
      if: ${{ always() && github.event_name != 'merge_group' && env.ERIGON_CI_GOCACHE_PATH != '' && env.ERIGON_CI_GOCACHE_KEY != '' }}
      continue-on-error: true
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.ERIGON_CI_GOCACHE_PATH }}
        key: ${{ env.ERIGON_CI_GOCACHE_KEY }}
        lookup-only: true

    - name: Prune Go build cache
      if: ${{ always() && github.event_name != 'merge_group' && env.ERIGON_CI_GOCACHE_PATH != '' && env.ERIGON_CI_GOCACHE_KEY != '' && steps.gocache-probe.outputs.cache-hit != 'true' }}
      shell: bash
      run: python3 tools/prune-gocache "$ERIGON_CI_GOCACHE_PATH"

    - uses: ./.github/actions/save-build-cache
      if: ${{ always() && github.event_name != 'merge_group' && env.ERIGON_CI_GOCACHE_PATH != '' && env.ERIGON_CI_GOCACHE_KEY != '' && steps.gocache-probe.outputs.cache-hit != 'true' }}
      continue-on-error: true
      with:
        gocache: ${{ env.ERIGON_CI_GOCACHE_PATH }}
        key: ${{ env.ERIGON_CI_GOCACHE_KEY }}

    - name: Check for existing module cache entry
      id: modcache-probe
      if: ${{ always() && github.event_name != 'merge_group' && env.ERIGON_CI_MODCACHE_COMPLETE == 'true' && env.ERIGON_CI_MODCACHE != '' && env.ERIGON_CI_MODCACHE_KEY != '' }}
      continue-on-error: true
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.ERIGON_CI_MODCACHE }}/cache/download
        key: ${{ env.ERIGON_CI_MODCACHE_KEY }}
        lookup-only: true

    - uses: ./.github/actions/save-mod-cache
      if: ${{ always() && github.event_name != 'merge_group' && env.ERIGON_CI_MODCACHE_COMPLETE == 'true' && env.ERIGON_CI_MODCACHE != '' && env.ERIGON_CI_MODCACHE_KEY != '' && steps.modcache-probe.outputs.cache-hit != 'true' }}
      continue-on-error: true
      with:
        modcache-path: ${{ env.ERIGON_CI_MODCACHE }}
        key: ${{ env.ERIGON_CI_MODCACHE_KEY }}

    - name: Report uncached test packages
      if: always()
      shell: bash
      run: |
        test -f run.log || exit 0
        awk '/^ok/ && !/\(cached\)/ { t = $3; sub(/s$/, "", t); print t, $2, $3 }' run.log \
          | sort -rn \
          | awk 'BEGIN { lines = "" } { lines = lines "%0A" $2 " (" $3 ")" } END { if (lines) print "::notice::Packages ran without test cache:" lines }'
