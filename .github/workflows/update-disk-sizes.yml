name: Docs - Update disk sizes

# Triggers after a successful sync-from-scratch run (full or minimal node).
# Archive sizes are not handled here: they are read manually from the Grafana
# dashboard and committed by hand in a dedicated monthly PR.
# Downloads the disk-usage artifacts, updates docs/site/src/data/disk-sizes.json,
# and opens (or updates) a draft PR against the docs deploy branch (vars.DOCS_DEPLOY_BRANCH).
on:
  # zizmor: ignore[dangerous-triggers] no checkout of triggering run's head; BASE_BRANCH comes from vars.DOCS_DEPLOY_BRANCH for workflow_run events
  workflow_run:
    workflows:
      - "QA - Sync from scratch (minimal node)"
      - "QA - Sync from scratch (full node)"
    types:
      - completed
    branches:
      - main
      - release/3.*
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID to pull disk-usage artifacts from"
        required: true
      base_branch:
        description: "Base branch to update (empty = vars.DOCS_DEPLOY_BRANCH)"
        required: false
      prune_mode:
        description: "Prune mode measured in that run"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - minimal

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: update-disk-sizes-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || 'manual' }}
  cancel-in-progress: false

jobs:
  update-disk-sizes:
    # For workflow_run: only proceed on success.
    # For workflow_dispatch: always proceed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Determine prune mode and source run ID
        id: determine
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PRUNE_MODE: ${{ github.event.inputs.prune_mode }}
          INPUT_RUN_ID: ${{ github.event.inputs.run_id }}
          INPUT_BASE_BRANCH: ${{ github.event.inputs.base_branch }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DOCS_DEPLOY_BRANCH: ${{ vars.DOCS_DEPLOY_BRANCH }}
        run: |
          set -euo pipefail
          BASE_BRANCH="$DOCS_DEPLOY_BRANCH"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_PRUNE_MODE" in
              full|minimal) ;;
              *)
                echo "::error::Invalid prune mode: $INPUT_PRUNE_MODE"
                exit 1
                ;;
            esac
            if ! [[ "$INPUT_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid run_id: must be numeric"
              exit 1
            fi
            BASE_BRANCH="${INPUT_BASE_BRANCH:-$DOCS_DEPLOY_BRANCH}"
            printf 'prune_mode=%s\n' "$INPUT_PRUNE_MODE" >> "$GITHUB_OUTPUT"
            printf 'source_run_id=%s\n' "$INPUT_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            # Map the producing workflow → the mode it measured:
            #   "QA - Sync from scratch (minimal node)" → minimal
            #   "QA - Sync from scratch (full node)"    → full
            if [[ "$WORKFLOW_RUN_NAME" == *"minimal"* ]]; then
              MODE=minimal
            elif [[ "$WORKFLOW_RUN_NAME" == *"full node"* ]]; then
              MODE=full
            else
              echo "::error::Unexpected producing workflow: $WORKFLOW_RUN_NAME"
              exit 1
            fi
            printf 'prune_mode=%s\n' "$MODE" >> "$GITHUB_OUTPUT"
            printf 'source_run_id=%s\n' "$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
          if ! [[ "$BASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid base_branch: set vars.DOCS_DEPLOY_BRANCH or pass base_branch; allowed chars are [A-Za-z0-9._/-]"
            exit 1
          fi
          printf 'base_branch=%s\n' "$BASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  ## v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}
          repositories: "erigon"
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.determine.outputs.base_branch }}
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: true

      - name: Prepare update branch
        env:
          BASE_BRANCH: ${{ steps.determine.outputs.base_branch }}
        run: |
          set -euo pipefail
          BRANCH="docs/auto/disk-sizes-${BASE_BRANCH//\//-}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
            # The long-lived auto branch carries only pending disk-sizes.json
            # edits; everything else in docs/site comes from base, unstaged so
            # the commit below stays limited to the two data files.
            git checkout "origin/$BASE_BRANCH" -- docs/site ':!docs/site/src/data/disk-sizes.json'
            git reset -q
          else
            git checkout -B "$BRANCH"
          fi

      - name: Download disk usage artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.determine.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: disk-usage-*
          path: ./artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh ./artifacts/ 2>/dev/null || echo "No artifacts found"

      - name: Verify artifacts are present
        env:
          SOURCE_RUN_ID: ${{ steps.determine.outputs.source_run_id }}
        run: |
          set -euo pipefail
          if [ -z "$(ls -A ./artifacts 2>/dev/null)" ]; then
            echo "::error::No disk-usage artifacts found in run $SOURCE_RUN_ID — aborting"
            exit 1
          fi
          echo "Found $(ls ./artifacts | wc -l) artifact file(s)"

      # Runs made before the sync workflows wrote a .method file next to the bytes carry no method. Take it from the
      # workflow file the run itself used, so a seg du estimate of such a run is not taken for a whole-datadir size.
      - name: Record the method of untagged seg du runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ steps.determine.outputs.source_run_id }}
        run: |
          set -euo pipefail
          # Assignments, not pipes into `if`: a failed lookup must fail the step, not publish the bytes untagged.
          RUN_INFO=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID" --jq '"\(.path) \(.head_sha)"')
          read -r WORKFLOW_PATH HEAD_SHA <<<"$RUN_INFO"
          WORKFLOW=$(gh api "repos/$REPO/contents/$WORKFLOW_PATH?ref=$HEAD_SHA" --jq .content | base64 -d)
          if grep -Eq 'erigon"? seg du' <<<"$WORKFLOW"; then
            for bytes in ./artifacts/disk-usage-*.txt; do
              method="${bytes%.txt}.method"
              if [ ! -e "$method" ]; then
                echo "seg-du" > "$method"
                echo "Recorded seg-du for $bytes from $WORKFLOW_PATH at $HEAD_SHA"
              fi
            done
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Update disk-sizes.json
        env:
          PRUNE_MODE: ${{ steps.determine.outputs.prune_mode }}
        run: |
          set -euo pipefail
          python3 docs/site/scripts/update-disk-sizes.py \
            ./artifacts \
            docs/site/src/data/disk-sizes.json \
            "$PRUNE_MODE"
          # Project the updated JSON onto the static markers in the
          # hardware-requirements page (see README "Disk size data flow").
          python3 docs/site/scripts/render-disk-sizes.py

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          TARGETS="docs/site/src/data/disk-sizes.json docs/site/docs/get-started/hardware-requirements.mdx"
          if git diff --quiet -- $TARGETS; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to disk sizes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- $TARGETS
          fi

      - name: Configure git
        if: steps.diff.outputs.changed == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-workflow-update-disk-sizes-run-${RUN_ID}"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push to update branch
        if: steps.diff.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ steps.determine.outputs.base_branch }}
        run: |
          set -euo pipefail
          BRANCH="docs/auto/disk-sizes-${BASE_BRANCH//\//-}"
          git add docs/site/src/data/disk-sizes.json docs/site/docs/get-started/hardware-requirements.mdx
          git commit -m "chore(docs): auto-update measured disk sizes [$(date +%Y-%m-%d)]"
          git push origin "$BRANCH"

      - name: Create or update draft PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          BASE_BRANCH: ${{ steps.determine.outputs.base_branch }}
        run: |
          set -euo pipefail
          BRANCH="docs/auto/disk-sizes-${BASE_BRANCH//\//-}"
          TODAY=$(date +%Y-%m-%d)
          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty' 2>/dev/null)

          if [ -z "$EXISTING" ]; then
            gh pr create \
              --draft \
              --head "$BRANCH" \
              --base "$BASE_BRANCH" \
              --title "docs: auto-update disk size measurements ($TODAY)" \
              --body "$(cat <<'EOF'
          ## Automated disk size update

          Opened automatically by the **Docs - Update disk sizes** CI workflow after a successful sync-from-scratch run.

          ### What changed
          `docs/site/src/data/disk-sizes.json` — `full` and/or `minimal` mode disk usage updated from the latest CI measurement. `docs/site/docs/get-started/hardware-requirements.mdx` is regenerated from it (static values between MDX markers), so both files are included and merging this PR is all that's needed.

          ### What this does NOT update
          - **Archive** mode: requires manual measurement from always-on snapshot machines.
          - **Recommended disk size** column: intentionally static (should remain a comfortable buffer above current usage).

          ### Before merging
          - Values should show gradual growth vs. the previous entry — a sudden drop or doubling is suspect.
          - If both `full` and `minimal` runs completed today, both sets of chains are included (the branch is updated by each run).

          🤖 Auto-generated by [update-disk-sizes.yml](/.github/workflows/update-disk-sizes.yml)
          EOF
          )"
            echo "Created new draft PR for branch $BRANCH"
          else
            echo "PR #$EXISTING already open for branch $BRANCH — branch updated"
          fi
