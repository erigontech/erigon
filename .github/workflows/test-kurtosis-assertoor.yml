name: Kurtosis Assertoor GitHub Action

env:
  DOCKERHUB_REPOSITORY: "erigontech/erigon"
  APP_REPO: "erigontech/erigon"
  # Pinned versions of third-party containers — bump here when upgrading.
  # These are cached via actions/cache (docker save/load) to avoid re-pulling
  # on every run and to eliminate Docker Hub rate-limit exposure.
  # The tags a suite .io pins — released CL/VC clients, assertoor, glamsterdam's
  # genesis generator and spamoor — are loaded at job start from those files
  # (single source of truth) by the "Load image versions" step, so the cache can't
  # drift from what kurtosis runs. glamsterdam's devnet lighthouse stays live: it
  # is a client under test, so serving a stale build would quietly change what the
  # suite covers. The tags below aren't pinned in any .io, so they stay here.
  # Kurtosis CLI pinned so its infra images (engine/core/files-artifacts-expander
  # are tagged with the CLI version) can be cached too. The vector and fluent-bit
  # tags are dictated by the Kurtosis release — sync them when bumping (see
  # logs_aggregator_functions and logs_collector_functions consts in
  # kurtosis-tech/kurtosis).
  KURTOSIS_VERSION: "1.20.0"
  KURTOSIS_VECTOR_IMAGE: "timberio/vector:0.45.0-debian"
  KURTOSIS_FLUENTBIT_IMAGE: "fluent/fluent-bit:4.0.0"
  # Engine-bootstrap helpers (logs-aggregator healthcheck, reverse proxy,
  # volume init) — also dictated by the Kurtosis release; sync when bumping.
  # curl-jq is untagged upstream, so the cache intentionally serves the
  # `latest` digest from the last warm rather than tracking live `latest`.
  # Without these cached, `kurtosis engine start` still needs Docker Hub and
  # dies on registry outages despite all the caching above.
  KURTOSIS_CURL_JQ_IMAGE: "badouralix/curl-jq:latest"
  KURTOSIS_TRAEFIK_IMAGE: "traefik:2.10.6"
  KURTOSIS_ALPINE_IMAGE: "alpine:3.17"
  # BuildKit image booted by docker/setup-buildx-action (pinned via driver-opts).
  # Cached and pre-loaded so buildx can fall back to the local copy when its
  # Docker Hub pull fails.
  BUILDKIT_IMAGE: "moby/buildkit:v0.30.0"
  # eth2-val-tools is the validator-keystore generator pulled during `kurtosis run`;
  # it publishes only :latest, so the cache serves the `latest` digest from the last
  # warm rather than tracking live `latest`.
  ETH2_VAL_TOOLS_IMAGE: "protolambda/eth2-val-tools:latest"
  # rpc-snooper is the EL/CL traffic proxy the snooper_enabled suites launch. The
  # ethereum-package pins no tag for it, so the cache serves the `latest` digest
  # from the last warm rather than tracking live `latest`.
  KURTOSIS_SNOOPER_IMAGE: "ethpandaops/rpc-snooper:latest"
  GENESIS_GENERATOR_IMAGE: "ethpandaops/ethereum-genesis-generator:4.0.4"
  CAPLIN_GENESIS_GENERATOR_IMAGE: "ethpandaops/ethereum-genesis-generator:3.3.7"
  KURTOSIS_PYTHON_IMAGE: "python:3.11-alpine"

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      cache-warming-only:
        description: "Compile test binaries only; skip test execution (for cache warming runs)"
        type: boolean
        default: false
      cl-images-only:
        description: "Only warm the third-party CL/kurtosis image cache; skip the build and tests"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Build the erigon image once for the whole matrix. The matrix below has
  # grown to suite × {serial, parallel} entries — having every entry run its
  # own buildx with `cache-to: type=gha,mode=max,scope=kurtosis-erigon-build`
  # means ~a dozen jobs hammering the same GHA cache key concurrently, which
  # the cache backend answers with 504s ("failed to parse error response 504"
  # → `failed to build`). One builder, one cache writer; the matrix consumes
  # the image as a run-scoped artifact.
  build-erigon-image:
    name: build-erigon-image
    if: ${{ !inputs.cl-images-only && !contains(github.event.pull_request.labels.*.name, 'skip-uncaching') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fast checkout git repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Conditional Docker Login
        # Only login if we can. Workflow works without it but we want to avoid
        # rate limiting by Docker Hub when possible. External repos don't
        # have access to our Docker secrets.
        if: |
          github.repository == 'erigontech/erigon' &&
          github.actor != 'dependabot[bot]' &&
          !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      - name: Restore cached buildkit image
        id: cache-buildkit-image
        uses: actions/cache/restore@v6
        with:
          path: /tmp/docker-cache-buildkit
          key: docker-buildkit-${{ env.BUILDKIT_IMAGE }}

      - name: Load cached buildkit image into daemon
        if: steps.cache-buildkit-image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-cache-buildkit/buildkit.tar

      # Best-effort: buildx pulls the image itself during bootstrap; this step
      # only seeds the cache that future runs fall back on.
      - name: Pull buildkit image for cache
        id: pull-buildkit-image
        if: steps.cache-buildkit-image.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          pull() {
            for n in 1 2 3; do
              if docker pull "$1"; then return 0; fi
              echo "docker pull $1 failed (attempt $n of 3)"
              sleep $((10 * n))
            done
            return 1
          }
          pull "${BUILDKIT_IMAGE}"
          mkdir -p /tmp/docker-cache-buildkit
          docker save "${BUILDKIT_IMAGE}" -o /tmp/docker-cache-buildkit/buildkit.tar

      - name: Save buildkit image to cache
        if: steps.cache-buildkit-image.outputs.cache-hit != 'true' && steps.pull-buildkit-image.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: /tmp/docker-cache-buildkit
          key: docker-buildkit-${{ env.BUILDKIT_IMAGE }}

      - name: Set up Docker Buildx
        id: buildx_setup
        continue-on-error: true
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      # setup-buildx boots BuildKit by pulling the pinned image from Docker Hub,
      # falling back to the pre-loaded local copy when the registry is down;
      # retry once so a transient failure doesn't fail the job.
      - name: Retry Docker Buildx setup on transient failure
        if: steps.buildx_setup.outcome == 'failure'
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build erigon Docker image (with BuildKit layer cache)
        id: build_erigon_image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: test/erigon:current-base
          build-args: |
            BINARIES=erigon caplin
          cache-from: type=gha,scope=kurtosis-erigon-build
          cache-to: type=gha,mode=max,scope=kurtosis-erigon-build

      # docker/build-push-action has no retry input; retry once so a transient
      # Docker Hub / GHA-cache failure doesn't fail an otherwise-good build.
      - name: Retry erigon Docker image build on transient failure
        if: steps.build_erigon_image.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: test/erigon:current-base
          build-args: |
            BINARIES=erigon caplin
          cache-from: type=gha,scope=kurtosis-erigon-build
          cache-to: type=gha,mode=max,scope=kurtosis-erigon-build

      - name: Export erigon image as a run-scoped artifact
        run: docker save test/erigon:current-base -o "${RUNNER_TEMP}/erigon-base-image.tar"

      - name: Upload erigon image artifact
        uses: actions/upload-artifact@v7
        with:
          name: erigon-base-image-${{ github.run_id }}
          path: ${{ runner.temp }}/erigon-base-image.tar
          retention-days: 1
          if-no-files-found: error

  # Warms the docker-cl-* and docker-buildkit-* caches on the default branch
  # (where merge_group runs restore them) via a dedicated workflow on a paths
  # filter + daily schedule — the caches only change when the pinned image
  # versions in this file change. lookup-only makes it a no-op when the cache
  # already exists.
  warm-third-party-images:
    if: ${{ inputs.cl-images-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Conditional Docker Login
        if: |
          github.repository == 'erigontech/erigon' &&
          github.actor != 'dependabot[bot]' &&
          !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      - name: Checkout kurtosis .io files
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/kurtosis
          persist-credentials: false

      - name: Load image versions from the .io files (single source of truth)
        run: |
          reg=.github/workflows/kurtosis/regular-assertoor.io
          pectra_io=.github/workflows/kurtosis/pectra.io
          glamsterdam_io=.github/workflows/kurtosis/glamsterdam.io
          caplin_io=.github/workflows/kurtosis/caplin-minimal-assertoor.io
          assertoor=$(yq -e '.assertoor_params.image' "$reg")
          pectra=$(yq -e '.assertoor_params.image' "$pectra_io")
          glamsterdam=$(yq -e '.assertoor_params.image' "$glamsterdam_io")
          lighthouse=$(yq -e '.participants_matrix.cl[] | select(.cl_type == "lighthouse") | .cl_image' "$reg")
          teku=$(yq -e '.participants_matrix.cl[] | select(.cl_type == "teku") | .cl_image' "$reg")
          genesis_glamsterdam=$(yq -e '.ethereum_genesis_generator_params.image' "$glamsterdam_io")
          spamoor_glamsterdam=$(yq -e '.spamoor_params.image' "$glamsterdam_io")
          lighthouse_vc=$(yq -e '.participants[] | select(.vc_type == "lighthouse") | .vc_image' "$caplin_io")
          # pectra's clients and caplin-minimal's assertoor are warmed under the tag
          # another suite pins. Bumping one alone leaves it out of the cache, which
          # is a slow path rather than a failure: warn, and hand the tag to the
          # pre-pull step so it is fetched with retries.
          uncached=
          check_warmed() { # .io file, tag it pins, tag the cache warms
            if [ "$2" != "$3" ]; then
              echo "::warning::$1 pins $2 but the cache warms $3; extend the cache key to warm it"
              uncached="$uncached $2"
            fi
          }
          check_warmed "$pectra_io" \
            "$(yq -e '.participants_matrix.cl[] | select(.cl_type == "teku") | .cl_image' "$pectra_io")" "$teku"
          check_warmed "$pectra_io" \
            "$(yq -e '.participants_matrix.cl[] | select(.cl_type == "lighthouse") | .cl_image' "$pectra_io")" "$lighthouse_vc"
          check_warmed "$caplin_io" "$(yq -e '.assertoor_params.image' "$caplin_io")" "$assertoor"
          echo "UNCACHED_IMAGES=${uncached# }" >> "$GITHUB_ENV"
          {
            echo "ASSERTOOR_IMAGE=$assertoor"
            echo "ASSERTOOR_PECTRA_IMAGE=$pectra"
            echo "ASSERTOOR_GLAMSTERDAM_IMAGE=$glamsterdam"
            echo "LIGHTHOUSE_IMAGE=$lighthouse"
            echo "TEKU_IMAGE=$teku"
            echo "GLAMSTERDAM_GENESIS_GENERATOR_IMAGE=$genesis_glamsterdam"
            echo "GLAMSTERDAM_SPAMOOR_IMAGE=$spamoor_glamsterdam"
            echo "LIGHTHOUSE_VC_IMAGE=$lighthouse_vc"
          } >> "$GITHUB_ENV"
          # Every cached tag stays spelled out in the cache key so a glance at the
          # Actions cache list shows what a key holds. Only the registry/org prefix
          # is dropped, which keeps the key clear of actions/cache's 512-char cap.
          key=docker-cl
          for image in "$lighthouse" "$lighthouse_vc" "$teku" "$assertoor" \
            "kurtosis:$KURTOSIS_VERSION" "$KURTOSIS_VECTOR_IMAGE" "$KURTOSIS_FLUENTBIT_IMAGE" \
            "$KURTOSIS_CURL_JQ_IMAGE" "$KURTOSIS_TRAEFIK_IMAGE" "$KURTOSIS_ALPINE_IMAGE" \
            "$ETH2_VAL_TOOLS_IMAGE" "$KURTOSIS_SNOOPER_IMAGE" "$pectra" "$glamsterdam" \
            "$GENESIS_GENERATOR_IMAGE" "$CAPLIN_GENESIS_GENERATOR_IMAGE" \
            "$genesis_glamsterdam" "$spamoor_glamsterdam" "$KURTOSIS_PYTHON_IMAGE"; do
            key="$key-${image##*/}"
          done
          [ ${#key} -le 512 ] \
            || echo "::warning::cache key is ${#key} chars, over the 512 actions/cache allows"
          echo "DOCKER_CACHE_KEY=$key" >> "$GITHUB_ENV"

      - name: Check whether third-party containers are already cached
        id: cache-cl-images
        uses: actions/cache/restore@v6
        with:
          path: /tmp/docker-cache
          key: ${{ env.DOCKER_CACHE_KEY }}
          lookup-only: true

      - name: Pull third-party containers
        if: steps.cache-cl-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-cache
          pull() {
            for n in 1 2 3; do
              if docker pull "$1"; then return 0; fi
              echo "docker pull $1 failed (attempt $n of 3)"
              sleep $((10 * n))
            done
            return 1
          }
          pull "${LIGHTHOUSE_IMAGE}"
          pull "${LIGHTHOUSE_VC_IMAGE}"
          pull "${TEKU_IMAGE}"
          pull "${ASSERTOOR_IMAGE}"
          pull "${ASSERTOOR_PECTRA_IMAGE}"
          pull "${ASSERTOOR_GLAMSTERDAM_IMAGE}"
          pull "kurtosistech/engine:${KURTOSIS_VERSION}"
          pull "kurtosistech/core:${KURTOSIS_VERSION}"
          pull "kurtosistech/files-artifacts-expander:${KURTOSIS_VERSION}"
          pull "${KURTOSIS_VECTOR_IMAGE}"
          pull "${KURTOSIS_FLUENTBIT_IMAGE}"
          pull "${KURTOSIS_CURL_JQ_IMAGE}"
          pull "${KURTOSIS_TRAEFIK_IMAGE}"
          pull "${KURTOSIS_ALPINE_IMAGE}"
          pull "${ETH2_VAL_TOOLS_IMAGE}"
          pull "${GENESIS_GENERATOR_IMAGE}"
          pull "${CAPLIN_GENESIS_GENERATOR_IMAGE}"
          pull "${GLAMSTERDAM_GENESIS_GENERATOR_IMAGE}"
          pull "${GLAMSTERDAM_SPAMOOR_IMAGE}"
          pull "${KURTOSIS_SNOOPER_IMAGE}"
          pull "${KURTOSIS_PYTHON_IMAGE}"
          docker save "${LIGHTHOUSE_IMAGE}" -o /tmp/docker-cache/lighthouse.tar
          docker save "${LIGHTHOUSE_VC_IMAGE}" -o /tmp/docker-cache/lighthouse-vc.tar
          docker save "${TEKU_IMAGE}" -o /tmp/docker-cache/teku.tar
          docker save "${ASSERTOOR_IMAGE}" -o /tmp/docker-cache/assertoor.tar
          docker save "${ASSERTOOR_PECTRA_IMAGE}" -o /tmp/docker-cache/assertoor-pectra.tar
          docker save "${ASSERTOOR_GLAMSTERDAM_IMAGE}" -o /tmp/docker-cache/assertoor-glamsterdam.tar
          docker save "kurtosistech/engine:${KURTOSIS_VERSION}" -o /tmp/docker-cache/kurtosis-engine.tar
          docker save "kurtosistech/core:${KURTOSIS_VERSION}" -o /tmp/docker-cache/kurtosis-core.tar
          docker save "kurtosistech/files-artifacts-expander:${KURTOSIS_VERSION}" -o /tmp/docker-cache/kurtosis-expander.tar
          docker save "${KURTOSIS_VECTOR_IMAGE}" -o /tmp/docker-cache/vector.tar
          docker save "${KURTOSIS_FLUENTBIT_IMAGE}" -o /tmp/docker-cache/fluentbit.tar
          docker save "${KURTOSIS_CURL_JQ_IMAGE}" -o /tmp/docker-cache/curl-jq.tar
          docker save "${KURTOSIS_TRAEFIK_IMAGE}" -o /tmp/docker-cache/traefik.tar
          docker save "${KURTOSIS_ALPINE_IMAGE}" -o /tmp/docker-cache/alpine.tar
          docker save "${ETH2_VAL_TOOLS_IMAGE}" -o /tmp/docker-cache/eth2-val-tools.tar
          docker save "${GENESIS_GENERATOR_IMAGE}" -o /tmp/docker-cache/genesis-generator.tar
          docker save "${CAPLIN_GENESIS_GENERATOR_IMAGE}" -o /tmp/docker-cache/caplin-genesis-generator.tar
          docker save "${GLAMSTERDAM_GENESIS_GENERATOR_IMAGE}" -o /tmp/docker-cache/glamsterdam-genesis-generator.tar
          docker save "${GLAMSTERDAM_SPAMOOR_IMAGE}" -o /tmp/docker-cache/spamoor.tar
          docker save "${KURTOSIS_SNOOPER_IMAGE}" -o /tmp/docker-cache/rpc-snooper.tar
          docker save "${KURTOSIS_PYTHON_IMAGE}" -o /tmp/docker-cache/python.tar

      - name: Save third-party containers to cache
        if: steps.cache-cl-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/docker-cache
          key: ${{ env.DOCKER_CACHE_KEY }}

      - name: Check whether buildkit image is already cached
        id: cache-buildkit-image
        uses: actions/cache/restore@v6
        with:
          path: /tmp/docker-cache-buildkit
          key: docker-buildkit-${{ env.BUILDKIT_IMAGE }}
          lookup-only: true

      - name: Pull buildkit image
        if: steps.cache-buildkit-image.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-cache-buildkit
          pull() {
            for n in 1 2 3; do
              if docker pull "$1"; then return 0; fi
              echo "docker pull $1 failed (attempt $n of 3)"
              sleep $((10 * n))
            done
            return 1
          }
          pull "${BUILDKIT_IMAGE}"
          docker save "${BUILDKIT_IMAGE}" -o /tmp/docker-cache-buildkit/buildkit.tar

      - name: Save buildkit image to cache
        if: steps.cache-buildkit-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/docker-cache-buildkit
          key: docker-buildkit-${{ env.BUILDKIT_IMAGE }}

  assertoor_test:
    name: assertoor_${{ matrix.suite }}_${{ matrix.commitment_mode }}_test
    needs: build-erigon-image
    # On cache-warming runs build-erigon-image alone warms the kurtosis image
    # cache; there's nothing for the matrix to do (the test step is skipped).
    if: ${{ !inputs.cache-warming-only && !inputs.cl-images-only && !contains(github.event.pull_request.labels.*.name, 'skip-uncaching') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 60
    strategy:
      # In merge_group: cancel sibling shards on first failure so ci-gate's
      # `needs` reach terminal state quickly and the broken PR can be evicted.
      # In PR runs: keep all shards going so authors see the full failure
      # picture across every shard.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        # test_timeout_minutes is a per-suite wall-clock cap for the Kurtosis+assertoor
        # step. Observed happy-path durations are roughly:
        #   glamsterdam / caplin-minimal ~12 min, pectra ~30 min, regular ~34 min.
        # The caps below give ~1.5–2x of the happy path so real regressions still
        # pass but pathological hangs (e.g. a node that silently stops proposing)
        # fail in reasonable time instead of burning hours.
        #
        # Each suite runs twice — once with serial commitment
        # (ERIGON_COMMITMENT_PARALLEL=false) and once with parallel — so
        # divergence is caught on the PR. Execution is parallel in both legs
        # (default). Matrix entries spawn separate hosted runners and run
        # concurrently — wall-clock unchanged, runner-minutes doubled.
        # All entries share the single erigon image built by build-erigon-image.
        include:
          - suite: regular
            package_args: .github/workflows/kurtosis/regular-assertoor.io
            ethereum_package_branch: "5.0.1"
            test_timeout_minutes: 50
            commitment_mode: serial
          - suite: regular
            package_args: .github/workflows/kurtosis/regular-assertoor.io
            ethereum_package_branch: "5.0.1"
            test_timeout_minutes: 50
            commitment_mode: parallel
          - suite: pectra
            package_args: .github/workflows/kurtosis/pectra.io
            ethereum_package_branch: "5.0.1"
            test_timeout_minutes: 45
            commitment_mode: serial
          - suite: pectra
            package_args: .github/workflows/kurtosis/pectra.io
            ethereum_package_branch: "5.0.1"
            test_timeout_minutes: 45
            commitment_mode: parallel
          - suite: glamsterdam
            package_args: .github/workflows/kurtosis/glamsterdam.io
            # Pinned to 6.1.0 rather than main to keep the suite reproducible;
            # the CLI >=1.18.1 requirement that forced the pin is now satisfied.
            ethereum_package_branch: "6.1.0"
            test_timeout_minutes: 20
            commitment_mode: serial
          - suite: glamsterdam
            package_args: .github/workflows/kurtosis/glamsterdam.io
            # Pinned to 6.1.0 rather than main to keep the suite reproducible;
            # the CLI >=1.18.1 requirement that forced the pin is now satisfied.
            ethereum_package_branch: "6.1.0"
            test_timeout_minutes: 20
            commitment_mode: parallel
          - suite: caplin-minimal
            package_args: .github/workflows/kurtosis/caplin-minimal-assertoor.io
            ethereum_package_url: "github.com/erigontech/ethereum-package"
            ethereum_package_branch: "erigontech/fix-caplin-launcher"
            test_timeout_minutes: 20
            commitment_mode: serial
          - suite: caplin-minimal
            package_args: .github/workflows/kurtosis/caplin-minimal-assertoor.io
            ethereum_package_url: "github.com/erigontech/ethereum-package"
            ethereum_package_branch: "erigontech/fix-caplin-launcher"
            test_timeout_minutes: 20
            commitment_mode: parallel

    steps:
      - name: Fast checkout git repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Conditional Docker Login
        # Only login if we can. Workflow works without it but we want to avoid
        # rate limiting by Docker Hub when possible. External repos don't
        # have access to our Docker secrets.
        if: |
          github.repository == 'erigontech/erigon' &&
          github.actor != 'dependabot[bot]' &&
          !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      - name: Load image versions from the .io files (single source of truth)
        run: |
          reg=.github/workflows/kurtosis/regular-assertoor.io
          pectra_io=.github/workflows/kurtosis/pectra.io
          glamsterdam_io=.github/workflows/kurtosis/glamsterdam.io
          caplin_io=.github/workflows/kurtosis/caplin-minimal-assertoor.io
          assertoor=$(yq -e '.assertoor_params.image' "$reg")
          pectra=$(yq -e '.assertoor_params.image' "$pectra_io")
          glamsterdam=$(yq -e '.assertoor_params.image' "$glamsterdam_io")
          lighthouse=$(yq -e '.participants_matrix.cl[] | select(.cl_type == "lighthouse") | .cl_image' "$reg")
          teku=$(yq -e '.participants_matrix.cl[] | select(.cl_type == "teku") | .cl_image' "$reg")
          genesis_glamsterdam=$(yq -e '.ethereum_genesis_generator_params.image' "$glamsterdam_io")
          spamoor_glamsterdam=$(yq -e '.spamoor_params.image' "$glamsterdam_io")
          lighthouse_vc=$(yq -e '.participants[] | select(.vc_type == "lighthouse") | .vc_image' "$caplin_io")
          # pectra's clients and caplin-minimal's assertoor are warmed under the tag
          # another suite pins. Bumping one alone leaves it out of the cache, which
          # is a slow path rather than a failure: warn, and hand the tag to the
          # pre-pull step so it is fetched with retries.
          uncached=
          check_warmed() { # .io file, tag it pins, tag the cache warms
            if [ "$2" != "$3" ]; then
              echo "::warning::$1 pins $2 but the cache warms $3; extend the cache key to warm it"
              uncached="$uncached $2"
            fi
          }
          check_warmed "$pectra_io" \
            "$(yq -e '.participants_matrix.cl[] | select(.cl_type == "teku") | .cl_image' "$pectra_io")" "$teku"
          check_warmed "$pectra_io" \
            "$(yq -e '.participants_matrix.cl[] | select(.cl_type == "lighthouse") | .cl_image' "$pectra_io")" "$lighthouse_vc"
          check_warmed "$caplin_io" "$(yq -e '.assertoor_params.image' "$caplin_io")" "$assertoor"
          echo "UNCACHED_IMAGES=${uncached# }" >> "$GITHUB_ENV"
          {
            echo "ASSERTOOR_IMAGE=$assertoor"
            echo "ASSERTOOR_PECTRA_IMAGE=$pectra"
            echo "ASSERTOOR_GLAMSTERDAM_IMAGE=$glamsterdam"
            echo "LIGHTHOUSE_IMAGE=$lighthouse"
            echo "TEKU_IMAGE=$teku"
            echo "GLAMSTERDAM_GENESIS_GENERATOR_IMAGE=$genesis_glamsterdam"
            echo "GLAMSTERDAM_SPAMOOR_IMAGE=$spamoor_glamsterdam"
            echo "LIGHTHOUSE_VC_IMAGE=$lighthouse_vc"
          } >> "$GITHUB_ENV"
          # Every cached tag stays spelled out in the cache key so a glance at the
          # Actions cache list shows what a key holds. Only the registry/org prefix
          # is dropped, which keeps the key clear of actions/cache's 512-char cap.
          key=docker-cl
          for image in "$lighthouse" "$lighthouse_vc" "$teku" "$assertoor" \
            "kurtosis:$KURTOSIS_VERSION" "$KURTOSIS_VECTOR_IMAGE" "$KURTOSIS_FLUENTBIT_IMAGE" \
            "$KURTOSIS_CURL_JQ_IMAGE" "$KURTOSIS_TRAEFIK_IMAGE" "$KURTOSIS_ALPINE_IMAGE" \
            "$ETH2_VAL_TOOLS_IMAGE" "$KURTOSIS_SNOOPER_IMAGE" "$pectra" "$glamsterdam" \
            "$GENESIS_GENERATOR_IMAGE" "$CAPLIN_GENESIS_GENERATOR_IMAGE" \
            "$genesis_glamsterdam" "$spamoor_glamsterdam" "$KURTOSIS_PYTHON_IMAGE"; do
            key="$key-${image##*/}"
          done
          [ ${#key} -le 512 ] \
            || echo "::warning::cache key is ${#key} chars, over the 512 actions/cache allows"
          echo "DOCKER_CACHE_KEY=$key" >> "$GITHUB_ENV"

      - name: Restore cached third-party containers
        id: cache-cl-images
        uses: actions/cache@v6
        with:
          path: /tmp/docker-cache
          key: ${{ env.DOCKER_CACHE_KEY }}

      - name: Load cached containers into daemon
        if: steps.cache-cl-images.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/docker-cache/lighthouse.tar
          docker load -i /tmp/docker-cache/lighthouse-vc.tar
          docker load -i /tmp/docker-cache/teku.tar
          docker load -i /tmp/docker-cache/assertoor.tar
          docker load -i /tmp/docker-cache/assertoor-pectra.tar
          docker load -i /tmp/docker-cache/assertoor-glamsterdam.tar
          docker load -i /tmp/docker-cache/kurtosis-engine.tar
          docker load -i /tmp/docker-cache/kurtosis-core.tar
          docker load -i /tmp/docker-cache/kurtosis-expander.tar
          docker load -i /tmp/docker-cache/vector.tar
          docker load -i /tmp/docker-cache/fluentbit.tar
          docker load -i /tmp/docker-cache/curl-jq.tar
          docker load -i /tmp/docker-cache/traefik.tar
          docker load -i /tmp/docker-cache/alpine.tar
          docker load -i /tmp/docker-cache/eth2-val-tools.tar
          docker load -i /tmp/docker-cache/genesis-generator.tar
          docker load -i /tmp/docker-cache/caplin-genesis-generator.tar
          docker load -i /tmp/docker-cache/glamsterdam-genesis-generator.tar
          docker load -i /tmp/docker-cache/spamoor.tar
          docker load -i /tmp/docker-cache/rpc-snooper.tar
          docker load -i /tmp/docker-cache/python.tar

      - name: Pull third-party containers and save to cache
        if: steps.cache-cl-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-cache
          pull() {
            for n in 1 2 3; do
              if docker pull "$1"; then return 0; fi
              echo "docker pull $1 failed (attempt $n of 3)"
              sleep $((10 * n))
            done
            return 1
          }
          pull "${LIGHTHOUSE_IMAGE}"
          pull "${LIGHTHOUSE_VC_IMAGE}"
          pull "${TEKU_IMAGE}"
          pull "${ASSERTOOR_IMAGE}"
          pull "${ASSERTOOR_PECTRA_IMAGE}"
          pull "${ASSERTOOR_GLAMSTERDAM_IMAGE}"
          pull "kurtosistech/engine:${KURTOSIS_VERSION}"
          pull "kurtosistech/core:${KURTOSIS_VERSION}"
          pull "kurtosistech/files-artifacts-expander:${KURTOSIS_VERSION}"
          pull "${KURTOSIS_VECTOR_IMAGE}"
          pull "${KURTOSIS_FLUENTBIT_IMAGE}"
          pull "${KURTOSIS_CURL_JQ_IMAGE}"
          pull "${KURTOSIS_TRAEFIK_IMAGE}"
          pull "${KURTOSIS_ALPINE_IMAGE}"
          pull "${ETH2_VAL_TOOLS_IMAGE}"
          pull "${GENESIS_GENERATOR_IMAGE}"
          pull "${CAPLIN_GENESIS_GENERATOR_IMAGE}"
          pull "${GLAMSTERDAM_GENESIS_GENERATOR_IMAGE}"
          pull "${GLAMSTERDAM_SPAMOOR_IMAGE}"
          pull "${KURTOSIS_SNOOPER_IMAGE}"
          pull "${KURTOSIS_PYTHON_IMAGE}"
          docker save "${LIGHTHOUSE_IMAGE}" -o /tmp/docker-cache/lighthouse.tar
          docker save "${LIGHTHOUSE_VC_IMAGE}" -o /tmp/docker-cache/lighthouse-vc.tar
          docker save "${TEKU_IMAGE}" -o /tmp/docker-cache/teku.tar
          docker save "${ASSERTOOR_IMAGE}" -o /tmp/docker-cache/assertoor.tar
          docker save "${ASSERTOOR_PECTRA_IMAGE}" -o /tmp/docker-cache/assertoor-pectra.tar
          docker save "${ASSERTOOR_GLAMSTERDAM_IMAGE}" -o /tmp/docker-cache/assertoor-glamsterdam.tar
          docker save "kurtosistech/engine:${KURTOSIS_VERSION}" -o /tmp/docker-cache/kurtosis-engine.tar
          docker save "kurtosistech/core:${KURTOSIS_VERSION}" -o /tmp/docker-cache/kurtosis-core.tar
          docker save "kurtosistech/files-artifacts-expander:${KURTOSIS_VERSION}" -o /tmp/docker-cache/kurtosis-expander.tar
          docker save "${KURTOSIS_VECTOR_IMAGE}" -o /tmp/docker-cache/vector.tar
          docker save "${KURTOSIS_FLUENTBIT_IMAGE}" -o /tmp/docker-cache/fluentbit.tar
          docker save "${KURTOSIS_CURL_JQ_IMAGE}" -o /tmp/docker-cache/curl-jq.tar
          docker save "${KURTOSIS_TRAEFIK_IMAGE}" -o /tmp/docker-cache/traefik.tar
          docker save "${KURTOSIS_ALPINE_IMAGE}" -o /tmp/docker-cache/alpine.tar
          docker save "${ETH2_VAL_TOOLS_IMAGE}" -o /tmp/docker-cache/eth2-val-tools.tar
          docker save "${GENESIS_GENERATOR_IMAGE}" -o /tmp/docker-cache/genesis-generator.tar
          docker save "${CAPLIN_GENESIS_GENERATOR_IMAGE}" -o /tmp/docker-cache/caplin-genesis-generator.tar
          docker save "${GLAMSTERDAM_GENESIS_GENERATOR_IMAGE}" -o /tmp/docker-cache/glamsterdam-genesis-generator.tar
          docker save "${GLAMSTERDAM_SPAMOOR_IMAGE}" -o /tmp/docker-cache/spamoor.tar
          docker save "${KURTOSIS_SNOOPER_IMAGE}" -o /tmp/docker-cache/rpc-snooper.tar
          docker save "${KURTOSIS_PYTHON_IMAGE}" -o /tmp/docker-cache/python.tar

      # An uncovered tag would otherwise be pulled inside `kurtosis run`, where a
      # registry blip fails the whole test step. Fetch it here instead, with the
      # same retries the cached images get; kurtosis still pulls it if this fails.
      - name: Pre-pull suite images the cache does not cover
        if: env.UNCACHED_IMAGES != ''
        run: |
          for image in ${UNCACHED_IMAGES}; do
            for n in 1 2 3; do
              if docker pull "$image"; then continue 2; fi
              echo "docker pull $image failed (attempt $n of 3)"
              sleep $((10 * n))
            done
            echo "::warning::could not pre-pull $image; kurtosis retries it at run time"
          done

      - name: Install Kurtosis CLI and start engine
        uses: ./.github/actions/setup-kurtosis
        with:
          version: ${{ env.KURTOSIS_VERSION }}

      - name: Download erigon image artifact
        uses: actions/download-artifact@v8
        with:
          name: erigon-base-image-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Load erigon base image into daemon
        run: docker load -i "${RUNNER_TEMP}/erigon-base-image.tar"

      - name: Bake commitment_mode env into the runtime image
        # Kurtosis launches `test/erigon:current` as the EL participant.
        # Add ERIGON_COMMITMENT_PARALLEL as an ENV layer on top of the shared
        # base image so the matrix entries differ only in commitment mode.
        env:
          ERIGON_COMMITMENT_PARALLEL: ${{ matrix.commitment_mode == 'parallel' && 'true' || 'false' }}
        run: |
          docker build -t test/erigon:current - <<EOF
          FROM test/erigon:current-base
          ENV ERIGON_COMMITMENT_PARALLEL=${ERIGON_COMMITMENT_PARALLEL}
          EOF

      - name: Run ${{ matrix.suite }} Kurtosis + assertoor tests
        # On branch push, tests already passed in the merge queue. This run exists
        # solely to warm Docker image and BuildKit caches on main for future PRs
        # and merge queue runs. Skip the actual tests to avoid redundant execution.
        if: '!inputs.cache-warming-only'
        # Per-suite cap — see matrix.test_timeout_minutes. Turns multi-hour
        # hangs (e.g. a node that silently stops proposing) into prompt
        # failures so the next investigation or retry can start sooner
        # instead of burning runner hours on a dead chain.
        timeout-minutes: ${{ matrix.test_timeout_minutes }}
        uses: erigontech/kurtosis-assertoor-github-action@v1.1.7
        with:
            enclave_name: "kurtosis-${{ matrix.suite }}-${{ matrix.commitment_mode }}-${{ github.run_id }}"
            ethereum_package_url: "${{ matrix.ethereum_package_url || 'github.com/ethpandaops/ethereum-package' }}"
            ethereum_package_args: "${{ matrix.package_args }}"
            ethereum_package_branch: "${{ matrix.ethereum_package_branch }}"
            kurtosis_extra_args: --verbosity detailed --cli-log-level trace
            persistent_logs: "true"

      - name: Dump Kurtosis enclave on failure
        # Capture per-service logs (el-*, cl-*, vc-*, spamoor, assertoor,
        # snooper-*) so test hangs can be diagnosed after the fact. GitHub's
        # log blob storage purges raw CI logs quickly (BlobNotFound within
        # hours), and the orchestration output alone doesn't tell us what
        # each container was actually doing.
        #
        # NB: `kurtosis enclave dump` refuses if the target directory already
        # exists — do NOT pre-create it.
        if: failure() && !inputs.cache-warming-only
        continue-on-error: true
        run: |
          set -eu
          enclave_name="kurtosis-${{ matrix.suite }}-${{ matrix.commitment_mode }}-${{ github.run_id }}"
          dump_dir="${RUNNER_TEMP}/kurtosis-dump-${{ matrix.suite }}-${{ matrix.commitment_mode }}"
          kurtosis enclave dump "$enclave_name" "$dump_dir" || true

      - name: Upload Kurtosis enclave dump
        if: failure() && !inputs.cache-warming-only
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: kurtosis-dump-${{ matrix.suite }}-${{ matrix.commitment_mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/kurtosis-dump-${{ matrix.suite }}-${{ matrix.commitment_mode }}
          retention-days: 7
          if-no-files-found: warn

      # In the merge queue, cancel the run on first failure so the gate
      # doesn't stall waiting for still-running siblings. PR runs keep
      # going so authors see the full failure picture.
      - name: Cancel workflow run on failure
        if: failure() && github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error title=Merge-queue root-cause failure::This job failed and is fast-cancelling the CI Gate run; THIS job is the real failure (the others show as cancelled). See its logs."
          gh run cancel ${{ github.run_id }} || true
