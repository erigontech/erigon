name: Changes

# Pull requests and merge groups skip code checks when only docs change.
# Other events keep full coverage.

on:
  workflow_call:
    outputs:
      code:
        description: "true unless the PR or merge group touches only docs/, root-level llms*.txt and root-level *.md"
        value: ${{ jobs.check.outputs.code }}
      docs_site:
        description: "true when the PR or merge group touches docs/site/**"
        value: ${{ jobs.check.outputs.docs_site }}

permissions:
  contents: read
  # Reads the PR file list via the REST API.
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      code: ${{ steps.check.outputs.code }}
      docs_site: ${{ steps.check.outputs.docs_site }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch merge group base
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            merge_group)
              files=$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" --)
              ;;
            pull_request)
              files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                --paginate --jq '.[].filename') \
                || { echo "Failed to fetch PR files from GitHub API"; exit 1; }
              ;;
            *)
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "docs_site=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # "code" = any file outside: docs/*, root-level llms*.txt, root-level *.md
          # (nested *.md like execution/README.md still counts as a code change)
          if grep -qvE '^(docs/|llms[^/]*\.txt$|[^/]*\.md$)' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^docs/site/' <<< "$files"; then
            echo "docs_site=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_site=false" >> "$GITHUB_OUTPUT"
          fi
