name: QA - RPC Performance Tests Latest

on:
  workflow_dispatch:
    inputs:
      run_all_clients:
        description: 'Run the Geth, Nethermind and Reth benchmarks besides the Erigon one'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 2 * * *'   # Run daily at 02:00 UTC

concurrency:
  group: rpc-performance-latest-${{ github.ref }}
  cancel-in-progress: false

env:
  CHAIN: mainnet
  ERIGON_QA_PATH: /home/qarunner/erigon-qa
  RPC_PAST_TEST_DIR: /opt/rpc-past-tests

jobs:
  setup:
    name: Setup benchmark run
    runs-on: [self-hosted, qa]
    permissions:
      contents: read
    outputs:
      run_id: ${{ steps.vars.outputs.run_id }}
      network: ${{ steps.vars.outputs.network }}
      matrix: ${{ steps.vars.outputs.matrix }}
      coordinated: ${{ steps.vars.outputs.coordinated }}
    steps:
      - name: Compute shared variables
        id: vars
        shell: bash
        env:
          INPUT_RUN_ALL_CLIENTS: ${{ github.event.inputs.run_all_clients }}
        run: |
          set -euo pipefail

          # Unique namespace for this workflow execution
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # schedule: all clients, every day; workflow_dispatch: erigon alone unless run_all_clients is set.
          # Every client joins the start barrier with all the other clients as its remotes.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$INPUT_RUN_ALL_CLIENTS" = "true" ]; then
            COORDINATED=true
            MATRIX='{"include":[
              {"client":"erigon",     "remotes":"geth,nethermind,reth",   "install_dir":""},
              {"client":"geth",       "remotes":"erigon,nethermind,reth", "install_dir":"/opt/go-ethereum"},
              {"client":"nethermind", "remotes":"erigon,geth,reth",       "install_dir":"/opt/nethermind"},
              {"client":"reth",       "remotes":"erigon,geth,nethermind", "install_dir":"/opt/reth"}
            ]}'
          else
            COORDINATED=false
            MATRIX='{"include":[
              {"client":"erigon",     "remotes":"",                       "install_dir":""}
            ]}'
          fi

          {
            echo "run_id=${RUN_ID}"
            echo "network=${{ env.CHAIN }}"
            echo "matrix<<EOF"
            echo "$MATRIX"
            echo "EOF"
            echo "coordinated=$COORDINATED"
          } >> "$GITHUB_OUTPUT"

      - name: Print configuration (for logs)
        shell: bash
        env:
          RUN_ID: ${{ steps.vars.outputs.run_id }}
          NETWORK: ${{ steps.vars.outputs.network }}
          COORDINATED: ${{ steps.vars.outputs.coordinated }}
        run: |
          set -euo pipefail
          echo "Run ID:             $RUN_ID"
          echo "Network:            $NETWORK"
          echo "All clients:        $COORDINATED"

      - name: Prepare Redis database
        if: steps.vars.outputs.coordinated == 'true'
        shell: bash
        working-directory: ${{ env.ERIGON_QA_PATH }}/test_system/qa-tests/rpc-tests
        env:
          RUN_ID: ${{ steps.vars.outputs.run_id }}
          NETWORK: ${{ steps.vars.outputs.network }}
          MATRIX: ${{ steps.vars.outputs.matrix }}
        run: |
          set -euo pipefail
          python3 -c 'import json, sys; [print(e["client"], e["remotes"]) for e in json.loads(sys.argv[1])["include"]]' "$MATRIX" |
            while read -r client remotes; do
              python3 coordinated_start.py --client "$client" --remote "$remotes" --run-id "$RUN_ID" --chain "$NETWORK" --signal-creation
            done

  test:
    name: Benchmark Latest ${{ matrix.client }}
    needs: [setup]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: [self-hosted, qa, Ethereum, "rpc-latest-${{ matrix.client }}"]
    timeout-minutes: 480
    permissions:
      contents: read
      actions: read
    env:
      RUN_ID: ${{ needs.setup.outputs.run_id }}
      NETWORK: ${{ needs.setup.outputs.network }}
      ERIGON_TESTBED_DATA_DIR: /opt/erigon-testbed/datadir
      TOTAL_TIME_SECONDS: 1200 # 20 minutes
      CLIENT_INSTALL_DIR: ${{ matrix.install_dir }}
      CLIENT: ${{ matrix.client }}
      REMOTES: ${{ matrix.remotes }}

    steps:
      - name: Set reference data dir based on branch
        run: |
          # For pull_request events base_ref is the target branch name; for push/dispatch parse from ref.
          BRANCH="$GITHUB_BASE_REF"
          if [ -z "$BRANCH" ]; then
            BRANCH="$GITHUB_REF"
            BRANCH="${BRANCH#refs/heads/}"
          fi
          if [[ "$BRANCH" == release/* ]]; then
            VERSION="${BRANCH#release/}"
            ERIGON_REFERENCE_DIR="/opt/erigon-versions/reference-version-${VERSION}"
          else
            ERIGON_REFERENCE_DIR="/opt/erigon-versions/reference-version"
          fi
          echo "ERIGON_REFERENCE_DIR=${ERIGON_REFERENCE_DIR}" >> $GITHUB_ENV
          echo "ERIGON_REFERENCE_DATA_DIR=${ERIGON_REFERENCE_DIR}/datadir" >> $GITHUB_ENV

      - name: Clean workspace
        run: find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout Erigon repository
        if: matrix.client == 'erigon'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: "0"
          filter: blob:none

      - name: Sanity check Redis config
        if: needs.setup.outputs.coordinated == 'true'
        shell: bash
        working-directory: ${{ env.ERIGON_QA_PATH }}/test_system/qa-tests/rpc-tests
        run: |
          set -euo pipefail
          python3 coordinated_start.py --client "$CLIENT" --remote "$REMOTES" --run-id "$RUN_ID" --chain "$NETWORK" --signal-creation

      - name: Checkout the rpc-tests version file and the benchmark script
        if: matrix.client != 'erigon'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/scripts/rpc_version.env
            .github/workflows/scripts/run_rpc_perf.sh
          sparse-checkout-cone-mode: false

      - name: Checkout RPC Tests Repository
        env:
          RUNNER_WS: ${{ runner.workspace }}
        run: |
          source .github/workflows/scripts/rpc_version.env
          rm -rf "$RUNNER_WS/rpc-tests"
          git -c advice.detachedHead=false clone --depth 1 --branch "$RPC_VERSION" https://github.com/erigontech/rpc-tests "$RUNNER_WS/rpc-tests"
          cd "$RUNNER_WS/rpc-tests"
          make rpc_perf
          if [ "$CLIENT" = "erigon" ]; then
            make rpc_pattern_gen
          fi

      - name: Clean Erigon Build Directory
        if: matrix.client == 'erigon'
        run: |
          make clean

      - name: Build Erigon
        if: matrix.client == 'erigon'
        run: |
          make erigon integration
        working-directory: ${{ github.workspace }}

      - name: Pause the Erigon instance dedicated to db maintenance
        if: matrix.client == 'erigon'
        run: |
          python3 $ERIGON_QA_PATH/test_system/db-producer/pause_production.py || true

      - name: Save Erigon datadir Directory
        if: matrix.client == 'erigon'
        id: save_datadir_step
        run: |
          rm -rf $ERIGON_TESTBED_DATA_DIR || true

          echo "Mirror datadir"
          if ! "$GITHUB_WORKSPACE/cmd/scripts/mirror-datadir.sh" "$ERIGON_REFERENCE_DATA_DIR" "$ERIGON_TESTBED_DATA_DIR" > /dev/null 2>&1; then
            echo "Failed to mirror datadir from $ERIGON_REFERENCE_DATA_DIR to $ERIGON_TESTBED_DATA_DIR"
            exit 1
          fi
          echo "datadir_saved=true" >> $GITHUB_OUTPUT

      - name: Run Migrations
        if: matrix.client == 'erigon'
        working-directory: ${{ github.workspace }}/build/bin
        run: |
          echo "Running migrations on datadir..."
          ./integration run_migrations --datadir $ERIGON_TESTBED_DATA_DIR --chain $CHAIN

      - name: Run Erigon
        if: matrix.client == 'erigon'
        id: erigon_running_step
        working-directory: ${{ github.workspace }}/build/bin
        run: |
          set +e # Disable exit on error
          echo "Starting Erigon..."

          ./erigon --prune.mode=minimal --datadir $ERIGON_TESTBED_DATA_DIR --http.api admin,debug,eth,parity,erigon,trace,web3,txpool,ots,net --ws > erigon.log 2>&1 &

          ERIGON_PID=$!
          echo "ERIGON_PID=$ERIGON_PID" >> $GITHUB_ENV
          echo "erigon_started=true" >> $GITHUB_OUTPUT
          
          sleep 5
          tail erigon.log
          
          if ! kill -0 "$ERIGON_PID" 2>/dev/null; then
            echo "Erigon failed to start"
            echo "::error::Error detected during tests: Erigon failed to start"
            exit 1
          fi
          echo "Erigon started"

      - name: Wait for port 8545 to be opened
        run: |
          # Geth, Nethermind and Reth are expected to be pre-running on their rpc-latest-* runners
          # Erigon was started above
          for i in {1..30}; do
            if nc -z localhost 8545; then
              echo "Port 8545 is open"
              break
            fi
            echo "Waiting for port 8545 to open..."
            sleep 10
          done
          if ! nc -z localhost 8545; then
            echo "Port 8545 did not open in time"
            echo "::error::Error detected during tests: Port 8545 did not open in time"
            exit 1
          fi

      - name: Wait for Erigon to reach the tip
        if: matrix.client == 'erigon'
        run: |
          # Same tip condition as the barrier: not syncing and the latest block at most 2 slots old.
          python3 - <<'EOF'
          import json, os, sys, time, urllib.request

          def rpc(method, params):
              req = urllib.request.Request("http://localhost:8545", headers={"Content-Type": "application/json"},
                                           data=json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode())
              with urllib.request.urlopen(req, timeout=10) as rsp:
                  return json.load(rsp)["result"]

          deadline = time.time() + int(os.environ["TOTAL_TIME_SECONDS"])
          while time.time() < deadline:
              try:
                  block = rpc("eth_getBlockByNumber", ["latest", False])
                  age = time.time() - int(block["timestamp"], 16)
                  if rpc("eth_syncing", []) is False and age <= 24:
                      print(f"Erigon at the tip: block {int(block['number'], 16)}, {age:.0f}s old")
                      sys.exit(0)
                  print(f"Waiting for the tip: block {int(block['number'], 16)}, {age:.0f}s old")
              except Exception as e:
                  print(f"Waiting for the tip: {e}")
              time.sleep(10)
          print("::error::Erigon did not reach the tip in time")
          sys.exit(1)
          EOF

      - name: Generate the latest patterns
        if: matrix.client == 'erigon'
        env:
          RUNNER_WS: ${{ runner.workspace }}
        run: |
          # Generated once from Erigon and shared with the other clients' jobs, so all clients replay the same requests.
          # Each count covers the largest step of its test, e.g. 30000:20 for eth_call, 6000:20 for mixed.
          cd "$RUNNER_WS/rpc-tests"
          ./build/bin/rpc_pattern_gen eth_call --url http://localhost:8545 \
            --counts 600000 --block-tag latest --verify --keep ok --fees drop \
            --out "perf/pattern/$CHAIN/stress_test_eth_call_gen_latest.jsonl"
          ./build/bin/rpc_pattern_gen eth_getLogs --url http://localhost:8545 \
            --counts 100000 --block-tag latest --verify --keep ok --fees drop \
            --out "perf/pattern/$CHAIN/stress_test_eth_getLogs_gen_latest.jsonl"
          ./build/bin/rpc_pattern_gen --profile "perf/pattern/$CHAIN/config/eth_getLogs_head.profile" --url http://localhost:8545 \
            --counts 200000 --block-tag latest --verify --keep ok --fees drop \
            --out "perf/pattern/$CHAIN/stress_test_eth_getLogs_head_gen_latest.jsonl"
          ./build/bin/rpc_pattern_gen --profile "perf/pattern/$CHAIN/config/eth_getLogs_topics.profile" --url http://localhost:8545 \
            --counts 100000 --block-tag latest --verify --keep ok --fees drop \
            --out "perf/pattern/$CHAIN/stress_test_eth_getLogs_topics_gen_latest.jsonl"
          ./build/bin/rpc_pattern_gen --profile "perf/pattern/$CHAIN/config/eth_getLogs_wide.profile" --url http://localhost:8545 \
            --counts 20000 --block-tag latest --verify --keep ok --fees drop \
            --out "perf/pattern/$CHAIN/stress_test_eth_getLogs_wide_gen_latest.jsonl"
          # The patterns that trace recent blocks are generated last, in the reverse order of their run.
          # blocks=32 keeps the traced blocks inside the recent state that full nodes keep (e.g. 128 blocks for Geth).
          for tracer in callTracer structLog; do
            option=""
            [ "$tracer" = callTracer ] && option="tracer=callTracer"
            printf '[methods]\ndebug_traceBlockByNumber 100%% %s blocks=32\n' "$option" > "$RUNNER_TEMP/trace_block_$tracer.profile"
          done
          ./build/bin/rpc_pattern_gen --profile "$RUNNER_TEMP/trace_block_structLog.profile" --url http://localhost:8545 \
            --counts 50 --block-tag latest --verify --keep ok \
            --out "perf/pattern/$CHAIN/stress_test_debug_traceBlockByNumber_structLog_gen_latest.jsonl"
          ./build/bin/rpc_pattern_gen --profile "$RUNNER_TEMP/trace_block_callTracer.profile" --url http://localhost:8545 \
            --counts 600 --block-tag latest --verify --keep ok \
            --out "perf/pattern/$CHAIN/stress_test_debug_traceBlockByNumber_callTracer_gen_latest.jsonl"
          ./build/bin/rpc_pattern_gen --profile "perf/pattern/$CHAIN/config/mixed.profile" --url http://localhost:8545 \
            --counts 120000 --block-tag latest --verify --keep ok --fees drop --max-blocks 2500 \
            --out "perf/pattern/$CHAIN/stress_test_mixed_gen_latest.jsonl"

      - name: Share the latest patterns with the other clients' jobs
        if: matrix.client == 'erigon' && needs.setup.outputs.coordinated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: latest-patterns-${{ github.run_attempt }}
          path: |
            ${{ runner.workspace }}/rpc-tests/perf/pattern/${{ env.CHAIN }}/stress_test_eth_call_gen_latest.jsonl
            ${{ runner.workspace }}/rpc-tests/perf/pattern/${{ env.CHAIN }}/stress_test_eth_getLogs_gen_latest.jsonl
            ${{ runner.workspace }}/rpc-tests/perf/pattern/${{ env.CHAIN }}/stress_test_eth_getLogs_head_gen_latest.jsonl
            ${{ runner.workspace }}/rpc-tests/perf/pattern/${{ env.CHAIN }}/stress_test_eth_getLogs_topics_gen_latest.jsonl
            ${{ runner.workspace }}/rpc-tests/perf/pattern/${{ env.CHAIN }}/stress_test_eth_getLogs_wide_gen_latest.jsonl
            ${{ runner.workspace }}/rpc-tests/perf/pattern/${{ env.CHAIN }}/stress_test_mixed_gen_latest.jsonl
            ${{ runner.workspace }}/rpc-tests/perf/pattern/${{ env.CHAIN }}/stress_test_debug_traceBlockByNumber_callTracer_gen_latest.jsonl
            ${{ runner.workspace }}/rpc-tests/perf/pattern/${{ env.CHAIN }}/stress_test_debug_traceBlockByNumber_structLog_gen_latest.jsonl
          retention-days: 1

      - name: Wait for the latest patterns from the erigon job
        if: matrix.client != 'erigon'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT: latest-patterns-${{ github.run_attempt }}
        run: |
          for i in {1..360}; do
            count=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT" |
              python3 -c "import json, sys; print(json.load(sys.stdin)['total_count'])" || true)
            if [ "$count" = "1" ]; then
              echo "Artifact $ARTIFACT available"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Artifact $ARTIFACT not uploaded by the erigon job in time"
          exit 1

      - name: Download the latest patterns
        if: matrix.client != 'erigon'
        uses: actions/download-artifact@v8
        with:
          name: latest-patterns-${{ github.run_attempt }}
          path: ${{ runner.workspace }}/rpc-tests/perf/pattern/${{ env.CHAIN }}

      - name: Find a consensus on a common time to run the benchmark
        if: needs.setup.outputs.coordinated == 'true'
        shell: bash
        working-directory: ${{ env.ERIGON_QA_PATH }}/test_system/qa-tests/rpc-tests
        run: |
          set -euo pipefail
          echo "Monitor sync, publish status to Redis, wait barrier, run Vegeta."
          echo "Context:"
          echo "  RUN_ID=${RUN_ID}"
          echo "  NETWORK=${NETWORK}"
          # Wait for an agreement between all the clients
          python3 coordinated_start.py --client "$CLIENT" --remote "$REMOTES" --run-id "$RUN_ID" --chain "$NETWORK" --deadline-timeout $TOTAL_TIME_SECONDS

      - name: Prepare the benchmark result directories
        id: prepare_perf
        env:
          RUNNER_WS: ${{ runner.workspace }}
        run: |
          set -euo pipefail

          if [ "$CLIENT" == "erigon" ]; then
            commit=$(git -C "$RUNNER_WS/erigon" rev-parse --short HEAD)
          else
            # The client checkouts are owned by another user than the runner, which git refuses without safe.directory
            commit=$(git -c safe.directory="$CLIENT_INSTALL_DIR" -C "$CLIENT_INSTALL_DIR" rev-parse --short HEAD || echo no-version)
          fi

          # a) Save text results to a directory with timestamp and commit hash
          past_test_dir=$RPC_PAST_TEST_DIR/${CHAIN}_$(date +%Y%m%d_%H%M%S)_comp_perf_$commit
          mkdir -p "$past_test_dir"
          # b) Save binary results to a fixed directory
          bin_past_test_dir=$RPC_PAST_TEST_DIR/${CHAIN}_bin
          rm -rf "$bin_past_test_dir"  # we want only the latest binary files
          mkdir -p "$bin_past_test_dir"

          result_dir="$RUNNER_WS/rpc-tests/perf/reports/$CHAIN"
          mkdir -p "$result_dir"

          # Moved to result_dir after all tests, since every test cleans result_dir
          output_log="$RUNNER_WS/rpc-tests/perf/output.log"
          > "$output_log"

          {
            echo "COMMIT=$commit"
            echo "PAST_TEST_DIR=$past_test_dir"
            echo "BIN_PAST_TEST_DIR=$bin_past_test_dir"
            echo "RESULT_DIR=$result_dir"
            echo "OUTPUT_LOG=$output_log"
            echo "RUNNER_WS=$RUNNER_WS"
          } >> "$GITHUB_ENV"

      # A failed load pattern does not stop the next ones; a failed sync between clients stops the benchmark.
      # Each pattern starts on the same block in all clients, otherwise a saturated client runs the later patterns on a newer chain head.
      - name: Run mixed
        id: perf_mixed
        continue-on-error: true
        run: bash .github/workflows/scripts/run_rpc_perf.sh mixed stress_test_mixed_gen_latest 1000:20,3000:20,6000:20 mixed true

      - name: Sync clients before trace_block_call_tracer
        if: needs.setup.outputs.coordinated == 'true'
        working-directory: ${{ env.ERIGON_QA_PATH }}/test_system/qa-tests/rpc-tests
        run: python3 coordinated_start.py --client "$CLIENT" --remote "$REMOTES" --run-id "$RUN_ID-trace_block_call_tracer" --chain "$NETWORK"

      # The traces (blocks=32) follow mixed at a low rate, while their blocks are still inside the recent state.
      - name: Run trace_block_call_tracer
        id: perf_trace_block_call_tracer
        continue-on-error: true
        run: bash .github/workflows/scripts/run_rpc_perf.sh debug_traceBlockByNumber stress_test_debug_traceBlockByNumber_callTracer_gen_latest 10:20,30:20 trace_block_call_tracer

      - name: Sync clients before trace_block_struct_log
        if: needs.setup.outputs.coordinated == 'true'
        working-directory: ${{ env.ERIGON_QA_PATH }}/test_system/qa-tests/rpc-tests
        run: python3 coordinated_start.py --client "$CLIENT" --remote "$REMOTES" --run-id "$RUN_ID-trace_block_struct_log" --chain "$NETWORK"

      - name: Run trace_block_struct_log
        id: perf_trace_block_struct_log
        continue-on-error: true
        run: bash .github/workflows/scripts/run_rpc_perf.sh debug_traceBlockByNumber stress_test_debug_traceBlockByNumber_structLog_gen_latest 3:5,5:10 trace_block_struct_log

      - name: Sync clients before eth_call_gen
        if: needs.setup.outputs.coordinated == 'true'
        working-directory: ${{ env.ERIGON_QA_PATH }}/test_system/qa-tests/rpc-tests
        run: python3 coordinated_start.py --client "$CLIENT" --remote "$REMOTES" --run-id "$RUN_ID-eth_call_gen" --chain "$NETWORK"

      - name: Run eth_call_gen
        id: perf_eth_call_gen
        continue-on-error: true
        run: bash .github/workflows/scripts/run_rpc_perf.sh eth_call stress_test_eth_call_gen_latest 100:30,1000:20,10000:20,20000:20,30000:20 eth_call_gen

      - name: Sync clients before eth_getLogs_gen
        if: needs.setup.outputs.coordinated == 'true'
        working-directory: ${{ env.ERIGON_QA_PATH }}/test_system/qa-tests/rpc-tests
        run: python3 coordinated_start.py --client "$CLIENT" --remote "$REMOTES" --run-id "$RUN_ID-eth_getLogs_gen" --chain "$NETWORK"

      - name: Run eth_getLogs_gen
        id: perf_eth_getLogs_gen
        continue-on-error: true
        run: bash .github/workflows/scripts/run_rpc_perf.sh eth_getLogs stress_test_eth_getLogs_gen_latest 1000:20,5000:20 eth_getLogs_gen

      - name: Sync clients before eth_getLogs_head
        if: needs.setup.outputs.coordinated == 'true'
        working-directory: ${{ env.ERIGON_QA_PATH }}/test_system/qa-tests/rpc-tests
        run: python3 coordinated_start.py --client "$CLIENT" --remote "$REMOTES" --run-id "$RUN_ID-eth_getLogs_head" --chain "$NETWORK"

      - name: Run eth_getLogs_head
        id: perf_eth_getLogs_head
        continue-on-error: true
        run: bash .github/workflows/scripts/run_rpc_perf.sh eth_getLogs stress_test_eth_getLogs_head_gen_latest 2000:20,10000:20 eth_getLogs_head

      - name: Sync clients before eth_getLogs_topics
        if: needs.setup.outputs.coordinated == 'true'
        working-directory: ${{ env.ERIGON_QA_PATH }}/test_system/qa-tests/rpc-tests
        run: python3 coordinated_start.py --client "$CLIENT" --remote "$REMOTES" --run-id "$RUN_ID-eth_getLogs_topics" --chain "$NETWORK"

      - name: Run eth_getLogs_topics
        id: perf_eth_getLogs_topics
        continue-on-error: true
        run: bash .github/workflows/scripts/run_rpc_perf.sh eth_getLogs stress_test_eth_getLogs_topics_gen_latest 1000:20,5000:20 eth_getLogs_topics

      - name: Sync clients before eth_getLogs_wide
        if: needs.setup.outputs.coordinated == 'true'
        working-directory: ${{ env.ERIGON_QA_PATH }}/test_system/qa-tests/rpc-tests
        run: python3 coordinated_start.py --client "$CLIENT" --remote "$REMOTES" --run-id "$RUN_ID-eth_getLogs_wide" --chain "$NETWORK"

      - name: Run eth_getLogs_wide
        id: perf_eth_getLogs_wide
        continue-on-error: true
        run: bash .github/workflows/scripts/run_rpc_perf.sh eth_getLogs stress_test_eth_getLogs_wide_gen_latest 200:20,1000:20 eth_getLogs_wide

      - name: Collect the benchmark results
        id: collect_results
        if: always() && steps.prepare_perf.outcome == 'success'
        env:
          OUTCOMES: >-
            mixed=${{ steps.perf_mixed.outcome }}
            trace_block_call_tracer=${{ steps.perf_trace_block_call_tracer.outcome }}
            trace_block_struct_log=${{ steps.perf_trace_block_struct_log.outcome }}
            eth_call_gen=${{ steps.perf_eth_call_gen.outcome }}
            eth_getLogs_gen=${{ steps.perf_eth_getLogs_gen.outcome }}
            eth_getLogs_head=${{ steps.perf_eth_getLogs_head.outcome }}
            eth_getLogs_topics=${{ steps.perf_eth_getLogs_topics.outcome }}
            eth_getLogs_wide=${{ steps.perf_eth_getLogs_wide.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mv "$OUTPUT_LOG" "$RESULT_DIR/"

          result=success
          for entry in $OUTCOMES; do
            echo "$entry"
            case "${entry#*=}" in
              success) ;;
              failure) result=failure ;;
              *) if [ "$result" = "success" ]; then result=incomplete; fi ;;
            esac
          done
          # A pattern is skipped after a failed sync too, so only the job status tells a cancellation apart
          if [ "$result" = "incomplete" ]; then
            if [ "$JOB_STATUS" = "cancelled" ]; then result=cancelled; else result=failure; fi
          fi
          echo "TEST_RESULT=$result" >> "$GITHUB_OUTPUT"

          case "$result" in
            success)
              echo "Tests completed successfully" ;;
            cancelled)
              echo "::notice::Benchmark cancelled before all the load patterns ran" ;;
            *)
              echo "::error::Error detected during tests"
              exit 1 ;;
          esac

      - name: Generate Summary
        if: always() && steps.prepare_perf.outcome == 'success'
        env:
          WORKFLOW: ${{ github.workflow }}
          TEST_RESULT: ${{ steps.collect_results.outputs.TEST_RESULT }}
        run: |
          SUMMARY_FILE="$RESULT_DIR/summary.md"
          LOG_FILE="$RESULT_DIR/output.log"

          {
            echo "# $WORKFLOW Report"
            echo
            echo "## Test Configuration"
            echo "- **Chain:** $CHAIN"
            echo "- **Client:** $CLIENT"
            echo "- **Result:** $TEST_RESULT"
            echo
            echo "## Test Output"
            echo '```'
          } > "$SUMMARY_FILE"

          cat "$LOG_FILE" >> "$SUMMARY_FILE"

          echo '```' >> "$SUMMARY_FILE"

          cat "$SUMMARY_FILE"
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always() && steps.prepare_perf.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ env.CHAIN }}-${{ matrix.client }}
          path: ${{ env.PAST_TEST_DIR }}

      - name: Stop Erigon
        if: always() && matrix.client == 'erigon'
        working-directory: ${{ github.workspace }}/build/bin
        run: |
          # Clean up erigon process if it's still running
          if [ -n "$ERIGON_PID" ] && kill -0 $ERIGON_PID 2> /dev/null; then
            echo "Erigon stopping..."
            kill $ERIGON_PID
            echo "Erigon stopped"
          else
            echo "Erigon has already terminated"
          fi

      - name: Upload Erigon logs
        if: matrix.client == 'erigon' && steps.prepare_perf.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: erigon-logs-${{ env.CHAIN }}
          path: ${{ github.workspace }}/build/bin/erigon.log

      - name: Delete Erigon Testbed Data Directory
        if: always() && matrix.client == 'erigon' && steps.save_datadir_step.outputs.datadir_saved == 'true'
        run: |
          rm -rf $ERIGON_TESTBED_DATA_DIR

      - name: Resume the Erigon instance dedicated to db maintenance
        if: always() && matrix.client == 'erigon'
        run: |
          python3 $ERIGON_QA_PATH/test_system/db-producer/resume_production.py || true

      - name: Send an error status to the other clients
        if: failure() && needs.setup.outputs.coordinated == 'true'
        shell: bash
        working-directory: ${{ env.ERIGON_QA_PATH }}/test_system/qa-tests/rpc-tests
        run: |
          for run_id in "$RUN_ID" "$RUN_ID-eth_call_gen" "$RUN_ID-eth_getLogs_gen" \
            "$RUN_ID-eth_getLogs_head" "$RUN_ID-eth_getLogs_topics" "$RUN_ID-eth_getLogs_wide"; do
            python3 coordinated_start.py --client "$CLIENT" --remote "$REMOTES" --run-id "$run_id" --chain "$NETWORK" --signal-error "workflow failed"
          done

  compare:
    name: Compare clients
    needs: [setup, test]
    if: always() && needs.setup.outputs.coordinated == 'true'
    runs-on: [self-hosted, qa]
    permissions:
      contents: read
    steps:
      - name: Clean workspace
        run: find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout the comparison script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts/compare_rpc_perf.py
          sparse-checkout-cone-mode: false

      - name: Download the test results of all clients
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-${{ env.CHAIN }}-*
          path: ${{ runner.temp }}/perf-results

      - name: Generate the comparison summary
        env:
          RESULTS_DIR: ${{ runner.temp }}/perf-results
        run: |
          python3 .github/workflows/scripts/compare_rpc_perf.py --results-dir "$RESULTS_DIR" | tee -a "$GITHUB_STEP_SUMMARY"
