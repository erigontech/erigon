name: SIMD tests

# The simd/archsimd kernels only build with Go 1.27 and GOEXPERIMENT=simd, which the regular
# test jobs (Go from go.mod, default experiments) never compile.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Test the SIMD kernels
        env:
          GOEXPERIMENT: jsonv2,simd
          GOTOOLCHAIN: local
        run: go test -count=1 ./common/hexutil/...
