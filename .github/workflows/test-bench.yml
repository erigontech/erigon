name: Benchmarks

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      cache-warming-only:
        description: "Compile test binaries only; skip test execution (for cache warming runs)"
        type: boolean
        default: false
  # Auto-fire on PRs that touch this workflow's own YAML so the exec-mode
  # matrix change can be validated in-PR without a manual dispatch.
  # Regular PRs that don't touch this file are unaffected — bench is
  # otherwise dispatch-only because it needs stable conditions.
  pull_request:
    paths:
      - '.github/workflows/test-bench.yml'

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: write

jobs:
  benchmarks:
    name: benchmarks (${{ matrix.commitment_mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        commitment_mode:
          - parallel
    env:
      ERIGON_COMMITMENT_PARALLEL: ${{ matrix.commitment_mode == 'parallel' && 'true' || 'false' }}

    steps:
      - name: Checkout custom actions
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-erigon
        id: erigon
        with:
          cleanup-space: true
          cache-namespace: test-bench

      - name: Run benchmarks
        if: '!inputs.cache-warming-only'
        # `go test -timeout` doesn't cover benchmarks (the testing alarm stops
        # before the bench phase), so a hung benchmark would only die at the
        # 60min job cap — which kills it with no diagnostics. This watchdog
        # fires first at 45min: SIGQUIT makes the Go runtime dump all goroutine
        # stacks into this step's log, pinpointing the stall, then fails the job.
        run: |
          (
            sleep 2700
            {
              echo "## bench stall watchdog"
              echo "test-bench exceeded 45min: sent SIGQUIT to the test binaries; goroutine dumps are in the 'Run benchmarks' step log"
            } >> "$GITHUB_STEP_SUMMARY"
            pkill -QUIT -f 'go-build.*\.test' || true
            sleep 120
            pkill -KILL -f 'go-build.*\.test' || true
          ) >/dev/null 2>&1 &
          watchdog_pid=$!
          cleanup() {
            pkill -P "$watchdog_pid" 2>/dev/null || true
            kill "$watchdog_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          make test-bench

      - name: Build test binaries (cache warming)
        if: inputs.cache-warming-only
        run: go test -run=^$ ./...

      - uses: ./.github/actions/cleanup-erigon
        if: always()
