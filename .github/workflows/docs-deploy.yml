name: Deploy Docs

on:
  push:
    branches:
      - release/3.6
    paths:
      - 'docs/site/**'

  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the publishing branch joins the production group. Any other ref gets its
  # own, because this group is evaluated before the build job's gate can skip it
  # and would otherwise cancel a live deployment.
  group: ${{ (github.ref_name == vars.DOCS_DEPLOY_BRANCH || github.ref == vars.DOCS_DEPLOY_BRANCH) && 'docs-pages' || format('docs-pages-idle-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # DOCS_DEPLOY_BRANCH is the single switch for which branch publishes, so a
    # merge here cannot flip the site and an older branch cannot clobber it.
    # Accepted either as a bare branch name or as a full refs/heads/ ref.
    if: github.ref_name == vars.DOCS_DEPLOY_BRANCH || github.ref == vars.DOCS_DEPLOY_BRANCH
    steps:
      # Full history: showLastUpdateTime and sitemap lastmod read git log per
      # file, and a shallow clone dates every page from the tip commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify llms.txt artifacts are up to date
        run: |
          python3 docs/site/scripts/generate-llms.py --check
          python3 -m unittest discover docs/site/scripts -v

      # Deploy only runs on push to the release branch (not fork PRs), so the
      # npm cache can't be poisoned by an untrusted actor; caching the
      # docs-site deps keeps the build fast.
      - uses: actions/setup-node@v6 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs/site

      - name: Build
        run: npm run build
        working-directory: docs/site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
