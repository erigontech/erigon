# Stable consume-enginex: split by fork.
# Engine API tests only exist from Paris (The Merge) onwards; the
# osaka shard also carries the BPO fork-transition fixtures.
# Pattern format: "<suite-regex>/<test-regex>" — the leading ".*/""
# matches the suite name (eest/consume-enginex) while the remainder
# filters individual pytest test IDs by fork parameter.
- sim: consume-enginex
  runner: ubuntu-latest
  sim-limit: ".*/.*fork_(Paris|Shanghai)"
  shard: paris+shanghai
  fixtures-tarball: eest_stable
  erigon-extra-flags: "--fcu.background.prune=false --fcu.timeout=0"
  max-failures: 0
  commitment_mode: serial
- sim: consume-enginex
  runner: ubuntu-latest
  sim-limit: ".*/.*fork_(Paris|Shanghai)"
  shard: paris+shanghai
  fixtures-tarball: eest_stable
  erigon-extra-flags: "--fcu.background.prune=false --fcu.timeout=0"
  max-failures: 0
  commitment_mode: parallel
- sim: consume-enginex
  runner: ubuntu-latest
