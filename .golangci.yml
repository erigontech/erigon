version: "2"
run:
  allow-parallel-runners: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - durationcheck
    - fatcontext
    - gochecksumtype
    - gocritic
    - gosmopolitan
    - modernize
    - nilnesserr
    - prealloc
    - reassign
    - govet
    - makezero
    - errchkjson
    - noctx
    - errorlint
    - unused
  disable:
    - testifylint
    - contextcheck
    - err113
    - exhaustive
    - gocheckcompilerdirectives
    - gosec
    - musttag
    - nilerr
    - protogetter
    - recvcheck
    - unparam
    - wrapcheck
    - sqlclosecheck # we don't use SQL
    - rowserrcheck # we don't use SQL
    - zerologlint # not don't use Zerolog
    - wastedassign # `ineffassign` linter is enabled by default
    - spancheck # we don't use OpenTelemetry
    - loggercheck # we don't use Zap
    - unconvert # not enough profit from always enabling
  settings:
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-checks:
        - ruleguard
      disabled-checks:
        - commentFormatting # disabled to avoid unnecessary friction on local lints and CI for minor whitespace changes without functional benefit
        - commentedOutCode # disabled to avoid false positives on doc examples, EIP spec comments, and JSON templates
      enabled-tags:
        - performance
        - diagnostic
      settings:
        hugeParam:
          sizeThreshold: 1000
        rangeExprCopy:
          sizeThreshold: 512
          skipTestFuncs: true
        ruleguard:
          rules: rules.go
        underef:
          skipRecvDeref: true
    staticcheck:
      # golangci's default set (all minus these ST) less SA1019, which waits on
      # 42 deprecations. Naming SA*/S1* alone would silently drop the ST and QF
      # checks already enforced; the noisy ones are muted by name in exclusions.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -SA1019
    govet:
      enable:
        - nilness
        - unusedwrite
      disable:
        - deepequalerrors
        - fieldalignment
        - shadow
        - unsafeptr
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - modernize
        path: _grpc\.pb\.go
      # Bootstrap exclusion for #22538: baseline errcheck findings, migrated
      # one package per PR. Remove a package's alternative once it's clean.
      - linters:
          - errcheck
        path: "^(\
          db/datadir\
          |db/datadir/reset\
          |db/datastruct/btindex\
          |db/datastruct/fusefilter\
          |db/downloader\
          |db/downloader/webseeds\
          |db/etl\
          |db/kv/kvcache\
          |db/kv/mdbx\
          |db/kv/mdbx/mdbxtest\
          |db/kv/membatchwithdb\
          |db/rawdb\
          |db/recsplit\
          |db/recsplit/eliasfano32\
          |db/seg\
          |db/snapshotsync\
          |db/snapshotsync/freezeblocks\
          |db/test\
          |diagnostics/diaglib\
          |diagnostics/diskutils\
          |execution/commitment\
          |execution/commitment/trie\
          |execution/exec\
          |execution/execmodule\
          |execution/execmodule/execmoduletester\
          |execution/protocol\
          |execution/protocol/aa\
          |execution/protocol/misc\
          |execution/protocol/rules/aura\
          |execution/protocol/rules/ethash\
          |execution/protocol/rules/merge\
          |execution/rlp\
          |execution/stagedsync\
          |execution/tests\
          |execution/tests/testutil\
          |execution/tracing/tracers/js\
          |execution/types\
          |execution/types/accounts\
          |node\
          |node/app/component\
          |node/debug\
          |node/nodecfg\
          |node/privateapi\
          |p2p\
          |p2p/discover\
          |p2p/discover/v5wire\
          |p2p/dnsdisc\
          |p2p/enode\
          |p2p/enr\
          |p2p/nat\
          |p2p/netutil\
          |p2p/rlpx\
          |p2p/sentry\
          |p2p/sentry/libsentry\
          |rpc\
          |rpc/jsonrpc\
          |rpc/rpchelper\
          |txnprovider/txpool\
          |txnprovider/txpool/tests\
          )/[^/]+\\.go$"
      - linters:
          - staticcheck
        text: ST1019|ST1029|ST5011|QF1003|QF1008|QF1001|QF1002|QF1012|QF1006|ST1005|ST1023|ST1012|QF1011|ST1008|ST1017|QF1007|QF1010
      - linters:
          - gosec
          - perfsprint
          - unused
          - prealloc
        path: test\.go
      - linters:
          - gocritic
          - gosec
          - unused
        path: hack\.go
      - linters:
          - gocritic
          - gosec
          - unused
        path: cmd/devp2p
      - linters:
          - gocritic
          - gosec
        path: metrics/sample\.go
      - linters:
          - gocritic
          - gosec
        path: p2p/dnsdisc
    paths:
      - build/
      - vendor/
      - third_party$
      - builtin$
      - examples$
      - testdata
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false
  exclusions:
    generated: lax
    paths:
      - build/
      - vendor/
      - third_party$
      - builtin$
      - examples$
      - testdata
