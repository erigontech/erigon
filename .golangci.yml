version: "2"
run:
  allow-parallel-runners: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - durationcheck
    - fatcontext
    - gochecksumtype
    - gocritic
    - gosmopolitan
    - modernize
    - nilnesserr
    - prealloc
    - reassign
    - govet
    - makezero
    - errchkjson
    - noctx
    - errorlint
    - unused
  disable:
    - testifylint
    - contextcheck
    - err113
    - exhaustive
    - gocheckcompilerdirectives
    - gosec
    - musttag
    - nilerr
    - protogetter
    - recvcheck
    - unparam
    - wrapcheck
    - sqlclosecheck # we don't use SQL
    - rowserrcheck # we don't use SQL
    - zerologlint # not don't use Zerolog
    - wastedassign # `ineffassign` linter is enabled by default
    - spancheck # we don't use OpenTelemetry
    - loggercheck # we don't use Zap
    - unconvert # not enough profit from always enabling
  settings:
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-checks:
        - ruleguard
      disabled-checks:
        - commentFormatting # disabled to avoid unnecessary friction on local lints and CI for minor whitespace changes without functional benefit
        - commentedOutCode # disabled to avoid false positives on doc examples, EIP spec comments, and JSON templates
      enabled-tags:
        - performance
        - diagnostic
      settings:
        hugeParam:
          sizeThreshold: 1000
        rangeExprCopy:
          sizeThreshold: 512
          skipTestFuncs: true
        ruleguard:
          rules: rules.go
        underef:
          skipRecvDeref: true
    modernize:
      # newexpr wants //go:fix inline on common.NewUint64 (391 call sites) — its own PR.
      disable:
        - newexpr
    staticcheck:
      # The only place staticcheck checks are turned off. A text: exclusion runs
      # the check and drops its output, which is how the SA/S1 gap this list
      # replaces went unnoticed. SA1019 waits on 42 deprecations; the rest are
      # golangci's own default-off ST plus the ST/QF we find too noisy.
      checks:
        - all
        - -SA1019
        - -QF1001
        - -QF1002
        - -QF1003
        - -QF1006
        - -QF1007
        - -QF1008
        - -QF1010
        - -QF1011
        - -QF1012
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1008
        - -ST1012
        - -ST1016
        - -ST1017
        - -ST1019
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
        - -ST1029
        - -ST5011
    govet:
      enable:
        - nilness
        - unusedwrite
      disable:
        - deepequalerrors
        - fieldalignment
        - shadow
        - unsafeptr
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - modernize
        path: _grpc\.pb\.go
      # Bootstrap exclusion for #22538: baseline errcheck findings, migrated
      # one package per PR. Remove a package's alternative once it's clean.
      - linters:
          - errcheck
        path: "^(\
          diagnostics/diaglib\
          |diagnostics/diskutils\
          |execution/commitment\
          |execution/commitment/trie\
          |execution/exec\
          |execution/execmodule\
          |execution/execmodule/execmoduletester\
          |execution/protocol\
          |execution/protocol/aa\
          |execution/protocol/misc\
          |execution/protocol/rules/aura\
          |execution/protocol/rules/ethash\
          |execution/protocol/rules/merge\
          |execution/rlp\
          |execution/stagedsync\
          |execution/tests\
          |execution/tests/testutil\
          |execution/tracing/tracers/js\
          |execution/types\
          |execution/types/accounts\
          |node\
          |node/app/component\
          |node/debug\
          |node/nodecfg\
          |node/privateapi\
          |p2p\
          |p2p/discover\
          |p2p/discover/v5wire\
          |p2p/dnsdisc\
          |p2p/enode\
          |p2p/enr\
          |p2p/nat\
          |p2p/netutil\
          |p2p/rlpx\
          |p2p/sentry\
          |p2p/sentry/libsentry\
          |rpc\
          |rpc/jsonrpc\
          |rpc/rpchelper\
          |txnprovider/txpool\
          |txnprovider/txpool/tests\
          )/[^/]+\\.go$"
      - linters:
          - gosec
          - perfsprint
          - unused
          - prealloc
        path: test\.go
      - linters:
          - gocritic
          - gosec
          - unused
        path: hack\.go
      - linters:
          - gocritic
          - gosec
          - unused
        path: cmd/devp2p
      - linters:
          - gocritic
          - gosec
        path: metrics/sample\.go
      - linters:
          - gocritic
          - gosec
        path: p2p/dnsdisc
    paths:
      - build/
      - vendor/
      - third_party$
      - builtin$
      - examples$
      - testdata
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false
  exclusions:
    generated: lax
    paths:
      - build/
      - vendor/
      - third_party$
      - builtin$
      - examples$
      - testdata
