version: "2"
run:
  allow-parallel-runners: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - durationcheck
    - fatcontext
    - gochecksumtype
    - gocritic
    - gosmopolitan
    - modernize
    - nilnesserr
    - prealloc
    - reassign
    - govet
    - makezero
    - errchkjson
    - noctx
    - errorlint
    - unused
  disable:
    - testifylint
    - contextcheck
    - err113
    - exhaustive
    - gocheckcompilerdirectives
    - gosec
    - musttag
    - nilerr
    - protogetter
    - recvcheck
    - unparam
    - wrapcheck
    - sqlclosecheck # we don't use SQL
    - rowserrcheck # we don't use SQL
    - zerologlint # not don't use Zerolog
    - wastedassign # `ineffassign` linter is enabled by default
    - spancheck # we don't use OpenTelemetry
    - loggercheck # we don't use Zap
    - unconvert # not enough profit from always enabling
  settings:
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-checks:
        - ruleguard
      disabled-checks:
        - commentFormatting # disabled to avoid unnecessary friction on local lints and CI for minor whitespace changes without functional benefit
        - commentedOutCode # disabled to avoid false positives on doc examples, EIP spec comments, and JSON templates
      enabled-tags:
        - performance
        - diagnostic
      settings:
        hugeParam:
          sizeThreshold: 1000
        rangeExprCopy:
          sizeThreshold: 512
          skipTestFuncs: true
        ruleguard:
          rules: rules.go
        underef:
          skipRecvDeref: true
    modernize:
      # newexpr wants //go:fix inline on common.NewUint64 (391 call sites) — its own PR.
      disable:
        - newexpr
    staticcheck:
      # The only place staticcheck checks are turned off. A text: exclusion runs
      # the check and drops its output, which is how the SA/S1 gap this list
      # replaces went unnoticed. SA1019 waits on 42 deprecations; the rest are
      # golangci's own default-off ST plus the ST/QF we find too noisy.
      checks:
        - all
        - -SA1019
        - -QF1001
        - -QF1002
        - -QF1003
        - -QF1006
        - -QF1007
        - -QF1008
        - -QF1010
        - -QF1011
        - -QF1012
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1008
        - -ST1012
        - -ST1016
        - -ST1017
        - -ST1019
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
        - -ST1029
        - -ST5011
    govet:
      enable:
        - nilness
        - unusedwrite
        - shadow
      disable:
        - deepequalerrors
        - fieldalignment
        - unsafeptr
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - modernize
        path: _grpc\.pb\.go
      # shadow runs under db/ only for now; the rest of the tree is not swept yet.
      - linters:
          - govet
        text: "^shadow:"
        path-except: "^db/"
      # Bootstrap exclusion: files with baseline shadow findings, migrated one
      # file per PR. Remove a file from the list once it is clean; a file that is
      # not listed is gated, so a fixed file cannot silently regress.
      - linters:
          - govet
        text: "^shadow:"
        path: "^(\
          db/datastruct/btindex/bpstree_bench_test\\.go\
          |db/datastruct/btindex/btree_index_test\\.go\
          |db/datastruct/btindex/interp_varlen_test\\.go\
          |db/datastruct/btindex/testhelpers_test\\.go\
          |db/datastruct/fusefilter/fusefilter_fuzz_test\\.go\
          |db/datastruct/fusefilter/fusefilter_realfile_test\\.go\
          |db/datastruct/fusefilter/fusefilter_writer\\.go\
          |db/datastruct/fusefilter/fusefilter_writer_test\\.go\
          |db/downloader/chaintoml\\.go\
          |db/downloader/downloader\\.go\
          |db/downloader/downloader_test\\.go\
          |db/downloader/webseed\\.go\
          |db/integrity/commitment_integrity\\.go\
          |db/integrity/no_gaps_in_canonical_headers\\.go\
          |db/integrity/receipts_no_duplicates\\.go\
          |db/kv/backup/backup\\.go\
          |db/kv/backup/datadir\\.go\
          |db/kv/kvcache/cache\\.go\
          |db/kv/mdbx/kv_abstract_test\\.go\
          |db/kv/mdbx/kv_mdbx\\.go\
          |db/kv/mdbx/kv_mdbx_test\\.go\
          |db/kv/membatchwithdb/memory_mutation\\.go\
          |db/kv/membatchwithdb/memory_mutation_test\\.go\
          |db/kv/membatchwithdb/memory_store_test\\.go\
          |db/kv/prune/prune\\.go\
          |db/kv/prune/prune_test\\.go\
          |db/kv/rawdbv3/txnum\\.go\
          |db/kv/rawdbv3/txnum_bench_test\\.go\
          |db/kv/remotedbserver/remotedbserver_test\\.go\
          |db/kv/temporal/kv_temporal_resources_test\\.go\
          |db/kv/temporal/kv_temporal_test\\.go\
          |db/rawdb/accessors_chain\\.go\
          |db/rawdb/accessors_chain_test\\.go\
          |db/rawdb/accessors_indexes_test\\.go\
          |db/recsplit/eliasfano32/elias_fano\\.go\
          |db/recsplit/eliasfano32/elias_fano_test\\.go\
          |db/recsplit/index\\.go\
          |db/recsplit/index_test\\.go\
          |db/recsplit/recsplit\\.go\
          |db/recsplit/recsplit_fuzz_test\\.go\
          |db/snapshotsync/freezeblocks/beacon_block_reader\\.go\
          |db/snapshotsync/freezeblocks/block_reader\\.go\
          |db/snapshotsync/freezeblocks/block_reader_bench_test\\.go\
          |db/snapshotsync/freezeblocks/block_snapshots\\.go\
          |db/snapshotsync/freezeblocks/caplin_snapshots\\.go\
          |db/snapshotsync/merger\\.go\
          |db/snapshotsync/snapshots\\.go\
          |db/snapshotsync/snapshotsync\\.go\
          |db/snaptype/type\\.go\
          |db/state/aggregator\\.go\
          |db/state/aggregator_bench_test\\.go\
          |db/state/aggregator_fuzz_test\\.go\
          |db/state/aggregator_test\\.go\
          |db/state/commitment_convert\\.go\
          |db/state/commitment_version_testutil_test\\.go\
          |db/state/domain\\.go\
          |db/state/domain_committed\\.go\
          |db/state/domain_test\\.go\
          |db/state/erigondb_settings\\.go\
          |db/state/execctx/domain_shared\\.go\
          |db/state/execctx/domain_shared_test\\.go\
          |db/state/execctx/statecache_readfill_test\\.go\
          |db/state/history\\.go\
          |db/state/history_test\\.go\
          |db/state/inverted_index\\.go\
          |db/state/inverted_index_test\\.go\
          |db/state/merge\\.go\
          |db/state/merge_test\\.go\
          |db/state/snap_creation_fragility_test\\.go\
          |db/state/squeeze\\.go\
          |db/state/squeeze_test\\.go\
          |db/state/stats/agg_log_stats\\.go\
          |db/state/temporal_mem_batch\\.go\
          |db/test/aggregator_ext_test\\.go\
          |db/test/domain_shared_bench_test\\.go\
          |db/test/domains_restart_test\\.go\
          |db/test/lifecycle_bench_test\\.go\
          )$"
      - linters:
          - gosec
          - perfsprint
          - unused
          - prealloc
        path: test\.go
      - linters:
          - gocritic
          - gosec
          - unused
        path: hack\.go
      - linters:
          - gocritic
          - gosec
          - unused
        path: cmd/devp2p
      - linters:
          - gocritic
          - gosec
        path: metrics/sample\.go
      - linters:
          - gocritic
          - gosec
        path: p2p/dnsdisc
    paths:
      - build/
      - vendor/
      - third_party$
      - builtin$
      - examples$
      - testdata
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false
  exclusions:
    generated: lax
    paths:
      - build/
      - vendor/
      - third_party$
      - builtin$
      - examples$
      - testdata
